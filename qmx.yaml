rules:
  # --- Architecture ---

  # The four sibling layer diagnostics (coverage, unreachable-layer,
  # potential-shadow, empty-template) no longer take a severity here: they
  # report a configuration error, so they fail the build unconditionally and
  # cannot be accepted by the ratchet. Only the edge violations this rule
  # reports as code debt still have a severity to choose.
  architecture.layer-violation:
    severity: error

  # --- Coupling ---

  # Core value objects are coupling magnets by design — every domain depends on them.
  coupling.cbo:
    suppress_namespaces:
      - subtree: Qualimetrix\Analysis\Finding\Contract
      # The refusal carrier and its origin/position values preserve authored provenance
      # across owner sections and Console adapters. This subtree is limited to that
      # public refusal vocabulary; other Configuration contracts remain judged.
      - subtree: Qualimetrix\Analysis\Configuration\Contract\Refusal
      # Exact declaration identities, logical symbols and level projections are shared
      # by evidence repositories, finding channels and publication. This subtree binds
      # only that neutral identity language; unrelated Core subjects stay measured.
      - subtree: Qualimetrix\Core\Symbol
      - subtree: Qualimetrix\Core\Path
    suppress_namespace_channels:
      # The exact declaration census exposes these orchestration namespace unions.
      # Their required capability composition spans the exact subject contracts;
      # moving the wiring only moves the signal. Declaration checks remain active.
      coupling.cbo:
        # Contract readership is intentional; declaration quality stays measured.
        - exact: 'Qualimetrix\Analysis\Evidence\ComputedMetrics\Contract\Definition'
        - exact: 'Qualimetrix\Analysis\Run\Pipeline'
        - exact: 'Qualimetrix\Infrastructure\Console'
        - exact: 'Qualimetrix\Infrastructure\Console\Command'
        - exact: 'Qualimetrix\Infrastructure\DependencyInjection\CompilerPass'
        - exact: 'Qualimetrix\Infrastructure\DependencyInjection\Configurator'
      coupling.cbo:namespace:
        # These exact contract namespaces grow with their intended named readers.
        - exact: 'Qualimetrix\Analysis\Evidence\DependencyModel\Contract'
        - exact: 'Qualimetrix\Analysis\Policy\Architecture\Contract'
        # Baseline joins acceptance, scope, measurement and finding contracts.
        - exact: 'Qualimetrix\Analysis\Policy\Baseline'
        # Authored directive values are shared contracts read by their named consumers.
        - exact: 'Qualimetrix\Analysis\Policy\Inline\Contract\Directive'
        # Shared run policies and scope records are read across capability owners.
        - exact: 'Qualimetrix\Analysis\Run\Contract\Configuration'
        # Own declarations are shared Run phase ports and result/coverage contracts.
        - exact: 'Qualimetrix\Analysis\Run\Contract\Pipeline'
        # The document schema is a shared authored-value vocabulary.
        - exact: 'Qualimetrix\Analysis\Configuration\Contract\Document\Schema'
        # Shared authored-value contracts have intentional inbound reach from
        # named section owners.
        - exact: 'Qualimetrix\Analysis\Configuration\Contract\Document'
        # Authored directive parsing and suppression consumers read the same public
        # Inline facts. Only this exact namespace channel is excluded; declaration
        # quality and descendant namespaces remain judged.
        - exact: 'Qualimetrix\Analysis\Policy\Inline\Contract'
        # Exact/subtree/regex values define one separator-bound selector language for
        # configuration, evidence and publication. Exact namespace scope leaves their
        # declarations and future child namespaces measured.
        - exact: 'Qualimetrix\Core\Pattern'
        # Summary composes finding/debt narration, health projection and terminal output
        # through the shared Report and FormatterContext boundary. Exact namespace scope
        # does not exclude the individual renderers or other coupling channels.
        - exact: 'Qualimetrix\Reporting\Formatter\Summary'
        # Report, context and grouping values are shared by renderers in distinct
        # publication subjects. Keeping Detail and Ordering separate changes the namespace
        # census without adding a new responsibility to those public values.
        - exact: 'Qualimetrix\Reporting'
        # Capability-owned resolvers read the shared document vocabulary and translate
        # configuration refusals through their authored origins. Removing those imports
        # would disconnect the common refusal and document contracts from their consumers.
        - exact: 'Qualimetrix\Analysis\Configuration'
        # OutputFormatResolver consults FormatterRegistryInterface to refuse an unknown
        # format before publication. The incoming registry reader is required to judge
        # that authored value; exact scope leaves formatter implementations judged.
        - exact: 'Qualimetrix\Reporting\Formatter'
        # Collectors, evidence rules and health/publication consumers share MetricName,
        # metric bags and the repository read port. The channel compiler validates judged
        # metric keys against that same vocabulary. Exact namespace scope leaves each
        # contract declaration and future child namespaces judged.
        - exact: 'Qualimetrix\Analysis\Evidence\Measurement\Contract'
    suppress_paths:
      # The dependency-kind vocabulary is a shared inbound contract.
      - exact: src/Analysis/Evidence/DependencyModel/Contract/DependencyType.php
      # The metric-value contract is read across capability owners.
      - exact: src/Analysis/Evidence/Measurement/Contract/MetricBag.php
      # RunCoverage retains analyzed-source coverage and memoized scope queries for
      # baseline admission; its inbound reach follows that shared evidence contract.
      - exact: src/Analysis/Policy/Baseline/Contract/RunCoverage.php
      # Baseline, entry and identity values are read by capture, matching and ceiling
      # judgement within the acceptance lifecycle; their reach follows those uses.
      - exact: src/Analysis/Policy/Baseline/Baseline.php
      - exact: src/Analysis/Policy/Baseline/BaselineEntry.php
      - exact: src/Analysis/Policy/Baseline/BaselineIdentity.php
      # MetricName is the common key vocabulary read by collectors, formulas and
      # judging channel declarations; splitting it would split the same metric language.
      - exact: src/Analysis/Evidence/Measurement/Contract/MetricName.php
      # The graph contract is intentionally a widely consumed type hub. Keep this
      # exact declaration measured by other rules without excluding its siblings.
      - exact: src/Analysis/Evidence/DependencyModel/Contract/DependencyGraphInterface.php
      # Resolved values are the shared read port of declared section owners;
      # Their inbound reach follows those readers, not a missing decomposition.
      - exact: src/Analysis/Configuration/Contract/Document/ResolvedValueInterface.php
      # The section declaration language is built by each owner; its reach
      # reflects those consumers and its declaration vocabulary.
      - exact: src/Analysis/Configuration/Contract/Document/Schema/NodeSchema.php
      # Document owners and refusal adapters read authored source provenance from
      # this carrier; those consumers are its contract responsibility.
      - exact: src/Analysis/Configuration/Contract/Document/Provenance.php
      # RunConfiguration carries discovery, collection and rule policies to named
      # Run and delivery consumers; its reach follows that shared run boundary.
      - exact: src/Analysis/Run/Contract/Configuration/RunConfiguration.php
      # Authored formula, applicability and threshold consumers read the same
      # immutable computed-metric definition contract.
      - exact: src/Analysis/Evidence/ComputedMetrics/Contract/Definition/ComputedMetricDefinition.php
      # File-target readers share one typed failure cause so refusal and cleanup
      # retain the same filesystem outcome.
      - exact: src/Core/FileTarget/FileTargetFailure.php
      # ResolvedTarget retains judged path membership and identity facts; TargetPath
      # provides their shared resolution facade. Splitting the facade adds a forwarding
      # dependency without separating that filesystem responsibility.
      - exact: src/Core/FileTarget/ResolvedTarget.php
      - exact: src/Core/FileTarget/TargetPath.php
      # NamespacePattern binds the shared selector definition to namespace separators
      # for authored configuration, finding exclusion and reporting drill-down.
      - exact: src/Core/Pattern/NamespacePattern.php
      # AST visitors depend on many php-parser node types (not actionable coupling).
      # Exact capability roots preserve the visitor exclusion without enrolling
      # a future Analysis/Evidence sibling.
      # Depth inside a capability root is deliberately not an axis. PathMatcher globs
      # through fnmatch without FNM_PATHNAME, so `*` crosses `/` and these patterns
      # kept matching after Design was split into subject folders. That is the chosen
      # behaviour, not an accident to be pinned back: the enrolment this list guards
      # against is a future sibling capability, while a subject folder inside an
      # already-excluded capability is that capability's own business. Pinning the
      # globs per subject would also mean editing every rule block below for each
      # new subject, which is the cost this shape buys off.
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Complexity/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Coupling/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Size/.*Visitor\.php'
      # DI configurators wire all services (coupling is their job)
      - subtree: src/Infrastructure/DependencyInjection
      # Infrastructure console commands and pipeline orchestrators need many deps
      - subtree: src/Infrastructure/Console
      - subtree: src/Analysis/Run/Pipeline
      # ConfigurationDocument is the shared resolved authored document read by each
      # capability resolver. This exact path remains separate from the Refusal subtree
      # and does not enroll unrelated Configuration contracts.
      - exact: src/Analysis/Configuration/Contract/ConfigurationDocument.php
    namespace:
      warning: 16
      error: 25
    class:
      warning: 20
      error: 30

  # Core contracts and value objects are coupling hubs by design.
  coupling.class-rank:
    suppress_paths:
      # Shared document provenance is a contract hub consumed across capabilities.
      - exact: src/Analysis/Configuration/Contract/Document/Provenance.php
      # Shared document schema is a contract hub consumed across capabilities.
      - exact: src/Analysis/Configuration/Contract/Document/Schema/NodeSchema.php
      # Shared source origin is a contract hub consumed across capabilities.
      - exact: src/Analysis/Configuration/Contract/Refusal/ConfigurationOrigin.php
      # The provider-owned metric bag is a shared carrier for collectors and rules.
      - exact: src/Analysis/Evidence/Measurement/Contract/MetricBag.php
      # This neutral authored-selector value is shared by path and namespace consumers.
      - exact: src/Core/Pattern/SelectorDefinition.php
      # The neutral source-byte primitive preserves identities across source and publication consumers.
      - exact: src/Core/SourceText/SourceBytes.php
      # The shared refusal carrier intentionally centralizes source-attributed refusals.
      - exact: src/Analysis/Configuration/Contract/Refusal/ConfigurationRefusal.php
      # Refusal position metadata carries the same source facts to configuration consumers.
      - exact: src/Analysis/Configuration/Contract/Refusal/RefusedPosition.php
    suppress_namespaces:
      - subtree: Qualimetrix\Analysis\Finding\Contract
      # Shared symbol and level vocabulary intentionally connects evidence and finding consumers.
      - subtree: Qualimetrix\Core\Symbol
      - subtree: Qualimetrix\Core\Path

  # Distance: leaf namespaces holding pure value objects, enums, and exceptions
  # are maximally concrete with few abstractions — that is the point of a
  # domain-VO sub-namespace. The Analysis.Policy.Architecture Layer root holds
  # that leaf's immutable layer values and its expansion implementation
  # (ADR 0022).
  #
  # Note on scope: plain `suppress_namespaces` entries match by prefix, so the two
  # entries below are blankets — `Qualimetrix\Core` covers the whole
  # Core tree and the Architecture Layer subtree including its Expansion child.
  # Configuration/Allow owns a separate concrete selector/value/parser leaf.
  coupling.distance:
    suppress_namespaces:
      # The concrete population language is a shared contract hub for judging rules and publication consumers.
      - exact: 'Qualimetrix\Analysis\Finding\Contract\Population'
      # Prose operations and glyph values provide concrete terminal rendering;
      # there is no independent abstract provider to introduce for those operations.
      - exact: 'Qualimetrix\Reporting\Formatter\Prose'
      # Baseline contract values carry acceptance, coverage and current-measurement
      # facts to their named readers; concrete facts need no abstract provider.
      - exact: 'Qualimetrix\Analysis\Policy\Baseline\Contract'
      # Token normalization is a private duplication representation, so its concrete
      # values stay inside the duplication lifecycle rather than inventing a module port.
      - exact: 'Qualimetrix\Analysis\Evidence\Duplication\Normalization'
      # Token window, suffix and hash indexing are concrete operations owned by
      # duplication matching; their local abstractness does not justify a provider port.
      - exact: 'Qualimetrix\Analysis\Evidence\Duplication\Index'
      # Authored directive records carry source spelling, subjects and positions to
      # parsing and audit readers; this concrete vocabulary has no provider lifecycle.
      - exact: 'Qualimetrix\Analysis\Policy\Inline\Contract\Directive'
      # ProjectScope values publish source-universe and narrowed-scope conclusions
      # to Run and reporting; concrete conclusions do not require abstract services.
      - exact: 'Qualimetrix\Analysis\Finding\Contract\ProjectScope'
      # Resolved document forms implement Configuration read ports outside this
      # namespace; local abstractness omits the public promises those forms implement.
      - exact: 'Qualimetrix\Analysis\Configuration\Document\Resolved'
      # Internal override parsing and validation implement Finding contracts outside
      # this namespace; local abstractness omits the promise they implement.
      - exact: 'Qualimetrix\Analysis\Finding\Rule\Override'
      - subtree: Qualimetrix\Core
      - subtree: Qualimetrix\Analysis\Policy\Architecture\Layer
      - subtree: Qualimetrix\Analysis\Policy\Architecture\Configuration\Allow
      - subtree: Qualimetrix\Analysis\Evidence\Prioritization\Debt
      - subtree: Qualimetrix\Infrastructure\Serializer
      # Immutable score and coverage values carry health facts through the public
      # contract; exact namespace scope leaves future child namespaces judged.
      - exact: 'Qualimetrix\Analysis\Evidence\ComputedMetrics\Health\Contract\Score'
      # Immutable offender records, rank modes and namespace selections form one
      # public vocabulary consumed by report renderers.
      - exact: 'Qualimetrix\Analysis\Evidence\ComputedMetrics\Health\Contract\Offender'
      # Concrete metadata catalogs implement a sibling Contract-owned public
      # surface. Exact-namespace abstractness therefore cannot see that port.
      - exact: 'Qualimetrix\Analysis\Evidence\ComputedMetrics\Health\Metadata'
      # The exact public vocabulary combines finding transports, channel declarations
      # and execution outcomes consumed by evidence, policy and publication.
      - exact: 'Qualimetrix\Analysis\Finding\Contract'
      # The rule language combines interfaces, immutable declarations, band values
      # and selectors consumed by evidence producers; the local concrete ratio mixes
      # those distinct public promises.
      - exact: 'Qualimetrix\Analysis\Finding\Contract\Rule'
      # Concrete override validators implement an externally consumed Finding
      # language; their local abstractness omits that cross-namespace contract.
      - exact: 'Qualimetrix\Analysis\Finding\Contract\Rule\Override'
      # Retired option spelling and vocabulary are centralized in Configuration.
      # Finding already reads Configuration, so placing those authored keys in Finding
      # would reverse the allowed dependency direction. The exact root remains separate
      # from its document, loader and pipeline subjects.
      - exact: 'Qualimetrix\Analysis\Configuration'
      - exact: 'Qualimetrix\Analysis\Configuration\Contract\Refusal'
      # The authored section language combines a public registration port, a builder
      # and immutable value vocabulary. Moving its judgement helpers into the engine
      # would make the public declaration language depend on that implementation.
      - exact: 'Qualimetrix\Analysis\Configuration\Contract\Document\Schema'
      # Manifest reader ports and immutable source facts are consumed across
      # discovery, scope, configuration and publication as one invocation snapshot.
      - exact: 'Qualimetrix\Analysis\ProjectManifest\Contract'
      # Run policy and source-scope contracts carry the same decisions to discovery,
      # collection, rule execution and delivery consumers.
      - exact: 'Qualimetrix\Analysis\Run\Contract\Configuration'
    max_distance_warning: 0.5
    max_distance_error: 0.7

  size.class-count:
    suppress_namespaces:
      # Temporary until this exact subject is split.
      - exact: 'Qualimetrix\Analysis\Evidence\CodeSmell'
      # Temporary until this exact subject is split.
      - exact: 'Qualimetrix\Analysis\Evidence\Coupling'
      # Temporary until this exact subject is split.
      - exact: 'Qualimetrix\Analysis\Finding\Contract\Rule'
      # Temporary until this exact subject is split.
      - exact: 'Qualimetrix\Analysis\Policy\Baseline'
      # Temporary until this exact subject is split.
      - exact: 'Qualimetrix\Infrastructure\Console'

  coupling.instability:
    suppress_namespace_channels:
      # Console composes configuration, analysis and publication through capability
      # contracts; its delivery direction is outward to those subjects.
      coupling.instability:
        - exact: 'Qualimetrix\Infrastructure\Console'
      coupling.instability:namespace:
        # Container assembly reads the registered Finding forms service to compose
        # the declared option language; moving that wiring only moves the same dependency.
        - exact: 'Qualimetrix\Infrastructure\DependencyInjection\CompilerPass'
        # Only two orchestration/composition readers consume this directive policy leaf.
        - exact: 'Qualimetrix\Analysis\Policy\Inline\Directive'
        # Coupling rules and collectors read judged-metric declarations, Measurement
        # contracts and Core symbols. Composition consumes that evidence capability;
        # its outward direction follows those required metric and rule vocabularies.
        - exact: 'Qualimetrix\Analysis\Evidence\Coupling'
        # UnboundSuppressionRule reads Finding and Configuration vocabulary to audit
        # authored suppressions; Console and container registration consume that leaf.
        - exact: 'Qualimetrix\Analysis\Finding\SuppressionBinding'
        # Scope checking and composition adapters read the internal run-configuration
        # operations that translate resolved policies into one invocation.
        - exact: 'Qualimetrix\Analysis\Run\Configuration'
        # Exact DI configurators name the capability services they assemble. Moving an
        # incoming composition edge does not remove those registration dependencies.
        - exact: 'Qualimetrix\Infrastructure\DependencyInjection\Configurator'
    suppress_paths:
      - exact: src/Analysis/Evidence/DependencyModel/Extraction/DependencyRecorder.php
      - exact: src/Analysis/Policy/Architecture/Layer/ClassContext/Ancestry.php
      - exact: src/Analysis/Policy/Architecture/Layer/ClassContext/ClassContextFactory.php
      - exact: src/Analysis/Policy/Architecture/Layer/ClassContext/KnownTypes.php
      - exact: src/Infrastructure/Composer/ComposerAutoloadMap.php
      - exact: src/Infrastructure/Composer/DeclaredSupertypeReader.php
      # Credential classifiers share native value interpretation through CredentialValue;
      # its outgoing type policy follows that classification responsibility.
      - exact: src/Analysis/Evidence/Security/Credential/CredentialValue.php
      # Baseline parsing, capture, update and comparability each compose the acceptance
      # vocabulary; ChannelUniverse composes registered channel declarations. These
      # exact operations remain distinct from sibling and future operations.
      - exact: src/Analysis/Policy/Baseline/BaselineEntryParser.php
      - exact: src/Analysis/Policy/Baseline/BaselineGenerator.php
      - exact: src/Analysis/Policy/Baseline/BaselineUpdater.php
      - exact: src/Analysis/Policy/Baseline/Ceiling/EntryComparability.php
      - exact: src/Infrastructure/Rule/ChannelUniverse.php
      # FileCache implements serialized entry persistence over the judged file-target
      # lifecycle; directory management remains a separate storage operation.
      - exact: src/Infrastructure/Cache/FileCache.php
      # BaselineDocumentWriter guards the held document identity and atomic write
      # lifecycle used by baseline capture and update.
      - exact: src/Analysis/Policy/Baseline/BaselineDocumentWriter.php
      # BaselineCleaner joins loaded acceptance entries, measured scope and channel
      # declarations to judge stale/inert entries before replacement.
      - exact: src/Analysis/Policy/Baseline/BaselineCleaner.php
      # FrameworkNamespaceSelectorParser judges framework namespace selectors;
      # LayersValidator judges authored layer declarations; RuleOptionDocumentForms
      # builds owner-provided option forms. Their outgoing vocabularies belong to
      # those separate exact configuration responsibilities.
      - exact: src/Analysis/Evidence/Coupling/Configuration/FrameworkNamespaceSelectorParser.php
      - exact: src/Analysis/Policy/Architecture/Configuration/LayersValidator.php
      - exact: src/Analysis/Finding/RuleConfiguration/OptionForms/RuleOptionDocumentForms.php
      # InlineDirectivePolicy joins authored directives, producer declarations and
      # source locations before rule execution; its dependencies establish that judgement.
      - exact: src/Analysis/Policy/Inline/Directive/InlineDirectivePolicy.php
      # LayerReading composes authored document layers; class/namespace options
      # implement their required band and override language; SelectionSpecificity
      # orders authored selectors; ConfigurationConfigurator composes that document
      # engine. These are exact operations rather than a blanket over their owners.
      - exact: src/Analysis/Configuration/Document/LayerReading.php
      - exact: src/Analysis/Evidence/Complexity/ClassCognitiveComplexityOptions.php
      - exact: src/Analysis/Evidence/Complexity/ClassComplexityOptions.php
      - exact: src/Analysis/Evidence/Coupling/ClassCboOptions.php
      - exact: src/Analysis/Evidence/Coupling/ClassInstabilityOptions.php
      - exact: src/Analysis/Evidence/Coupling/NamespaceCboOptions.php
      - exact: src/Analysis/Finding/Selection/SelectionSpecificity.php
      - exact: src/Infrastructure/DependencyInjection/Configurator/ConfigurationConfigurator.php
      # UsageTrackingTrait records private member usage during AST traversal; the
      # exact trait does not enroll other visitors or future capability siblings.
      - exact: src/Analysis/Evidence/CodeSmell/UsageTrackingTrait.php
      # Console commands/orchestrators sit at the top of the stack: I→1 is correct there
      - subtree: src/Infrastructure/Console
      # AbstractTypeCoverageRule joins the shared type-coverage judgement used by
      # its concrete parameter, return and property producers.
      - exact: src/Analysis/Evidence/Design/TypeCoverage/AbstractTypeCoverageRule.php
    class:
      min_afferent: 2
    namespace:
      min_afferent: 2
      max_warning: 0.9
      max_error: 1.0

  # --- Complexity ---

  # AST visitors inherently have high NPath/CCN/WMC due to many node type branches.
  # This is structural complexity from matching PHP AST node types, not a design flaw.
  #
  # Each regex below names an existing evidence capability and its AST visitors;
  # non-visitor orchestration and rule judgement stay measured.
  complexity.npath:
    suppress_paths:
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      # No Complexity root: no visitor there branches on node types past the
      # bound, and an entry that suppresses nothing would hide the first one that does.
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Size/.*Visitor\.php'

  # Options classes implement the same resolved factory, band and metadata
  # language. Token normalization erases differing channel literals.
  duplication.clone:
    min_tokens: 100
    suppress_paths:
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Options\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Options\.php'
      - regex: 'src/Analysis/Evidence/Complexity/.*Options\.php'
      - regex: 'src/Analysis/Evidence/Coupling/.*Options\.php'
      - regex: 'src/Analysis/Evidence/Design/.*Options\.php'
      - regex: 'src/Analysis/Evidence/Maintainability/.*Options\.php'
      - regex: 'src/Analysis/Evidence/Security/.*Options\.php'
      - regex: 'src/Analysis/Evidence/Size/.*Options\.php'
      # SuppressionBinding options implement the same declared enabled/severity
      # metadata and resolved factory contract. Token normalization erases their
      # channel literals; extracting only interface-shaped metadata adds no behaviour.
      - regex: 'src/Analysis/Finding/SuppressionBinding/.*Options\.php'
      # CboRule and InstabilityRule implement the same required name, level and
      # options metadata. Token normalization erases different channel literals;
      # their actual coupling judgements remain independent. Both exact rules are
      # named because each copy receives its own clone finding.
      - exact: src/Analysis/Evidence/Coupling/CboRule.php
      - exact: src/Analysis/Evidence/Coupling/InstabilityRule.php

  complexity.ccn:
    suppress_paths:
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Complexity/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'
      # No Security root: no visitor there branches on node types past the bound,
      # and an entry that suppresses nothing would hide the first one that does.
      - regex: 'src/Analysis/Evidence/Size/.*Visitor\.php'

  complexity.wmc:
    suppress_paths:
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Complexity/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Coupling/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Size/.*Visitor\.php'

  complexity.cognitive:
    suppress_paths:
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      # No Complexity root, for the reason given under complexity.npath.
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'

  # --- Code Smells ---

  code-smell.exit:
    suppress_paths:
      # An OOM shutdown is already terminal; throwing cannot recover it or
      # select the environment outcome required by the memory-fatal tests.
      - exact: src/Infrastructure/Console/Refusal/OutOfMemoryHint.php
      # Only the owner may unwind staged output; inherited handlers terminate a child with its signal status.
      - exact: src/Infrastructure/Console/RunTarget/StagedSignalGuard.php

  # No exclusions needed: the rule itself no longer flags promoted constructor
  # properties (a promoted param is a field declaration, not a behavior switch),
  # so the whole-tree exclusions this block used to carry — src/Core, src/Reporting,
  # src/Infrastructure/Console, src/Architecture/Domain, the *Options.php globs —
  # became pure compensation for a rule-level false positive and were removed.
  # They were also hiding ~23 genuine boolean arguments, which are now visible.
  code-smell.boolean-argument:
    allowed_prefixes: [is, has, can, should, will, did, was]

  code-smell.error-suppression:
    allowed_functions:
      - file_get_contents
      - file_put_contents
      - fopen
      - unlink
      - mkdir
      - rename
      - rmdir
      - json_decode
      - token_get_all
      - proc_open
      - hash_file
      - igbinary_serialize
      - igbinary_unserialize
      - unserialize

  # Data-carrying objects and pipeline services need many constructor params.
  # This is a natural pattern for immutable VOs, not a design smell.
  code-smell.long-parameter-list:
    warning: 8
    error: 12
    suppress_paths:
      # Prepared run and authored computed-metric definitions carry immutable facts, not service groups.
      - exact: src/Analysis/Run/Pipeline/PreparedRun.php
      - exact: src/Analysis/Evidence/ComputedMetrics/Contract/Definition/ComputedMetricDefinition.php
      # Mandatory independent declaration, policy and evidence facts are not injected services.
      - exact: src/Analysis/Evidence/DependencyModel/Contract/Dependency.php
      - exact: src/Analysis/Policy/Architecture/Contract/ExternalSupertypes.php
      - exact: src/Analysis/Policy/Architecture/Contract/LayerAssignment.php
      - exact: src/Analysis/Policy/Architecture/Layer/ClassContext/ClassContext.php
      - exact: src/Analysis/Policy/Architecture/Layer/ExcludeSpec.php
      - exact: src/Analysis/Policy/Architecture/Layer/MembershipSpec.php
      - exact: src/Analysis/Policy/Architecture/Observation/ClassWalkEvidence.php
      - exact: src/Analysis/Policy/Architecture/Observation/LayerEvidence.php
      # These immutable snapshots carry independent public facts, not injected service groups.
      - exact: src/Analysis/Finding/Contract/ChannelDeclaration.php
      - exact: src/Analysis/Policy/Baseline/Contract/BaselineDocument.php
      - exact: src/Analysis/Policy/Baseline/Contract/CeilingOutcome.php
      - exact: src/Analysis/Policy/Baseline/Contract/CurrentMeasurement.php
      - exact: src/Reporting/FindingProjection/FindingProjectionResult.php
      # Authored suppressions, report context and successful file results carry independent immutable facts.
      - exact: src/Analysis/Policy/Inline/Contract/Suppression/Suppression.php
      - exact: src/Reporting/Report.php
      - exact: src/Reporting/FormatterContext.php
      - exact: src/Analysis/Evidence/DependencyModel/DependencyGraph.php
      - exact: src/Analysis/Run/Contract/Collection/SuccessfulFileProcessing.php
      - exact: src/Analysis/Run/Pipeline/AnalysisPipeline.php
      - exact: src/Infrastructure/Console/Command/CheckCommand.php
      - exact: src/Infrastructure/Console/ResultPresenter.php
      - exact: src/Analysis/Finding/Contract/Finding.php

  code-smell.constructor-overinjection:
    suppress_paths:
      # Prepared run and authored computed-metric definitions carry immutable facts, not service groups.
      - exact: src/Analysis/Run/Pipeline/PreparedRun.php
      - exact: src/Analysis/Evidence/ComputedMetrics/Contract/Definition/ComputedMetricDefinition.php
      # Mandatory independent declaration, policy and evidence facts are not injected services.
      - exact: src/Analysis/Evidence/DependencyModel/Contract/Dependency.php
      - exact: src/Analysis/Policy/Architecture/Contract/ExternalSupertypes.php
      - exact: src/Analysis/Policy/Architecture/Contract/LayerAssignment.php
      - exact: src/Analysis/Policy/Architecture/Layer/ClassContext/ClassContext.php
      - exact: src/Analysis/Policy/Architecture/Layer/ExcludeSpec.php
      - exact: src/Analysis/Policy/Architecture/Layer/MembershipSpec.php
      - exact: src/Analysis/Policy/Architecture/Observation/ClassWalkEvidence.php
      - exact: src/Analysis/Policy/Architecture/Observation/LayerEvidence.php
      # These immutable snapshots carry independent public facts, not injected service groups.
      - exact: src/Analysis/Finding/Contract/ChannelDeclaration.php
      - exact: src/Analysis/Policy/Baseline/Contract/BaselineDocument.php
      - exact: src/Analysis/Policy/Baseline/Contract/CeilingOutcome.php
      - exact: src/Analysis/Policy/Baseline/Contract/CurrentMeasurement.php
      - exact: src/Reporting/FindingProjection/FindingProjectionResult.php
      # Authored suppressions, report context and successful file results carry independent immutable facts.
      - exact: src/Analysis/Policy/Inline/Contract/Suppression/Suppression.php
      - exact: src/Reporting/Report.php
      - exact: src/Reporting/FormatterContext.php
      - exact: src/Analysis/Run/Contract/Collection/SuccessfulFileProcessing.php

  code-smell.unreachable-code:
    warning: 1
    error: 1

  # MethodCountMetrics tracks many per-class counts (each is a separate property)
  size.property-count:
    warning: 15
    error: 15
    suppress_paths:
      - exact: src/Analysis/Evidence/Size/MethodCountMetrics.php

  # --- Design ---

  # AbstractRule and AbstractCollector have many children — this is by design
  # (one rule/collector per metric category).
  design.noc:
    warning: 10
    error: 10
    suppress_paths:
      - exact: src/Analysis/Finding/Contract/Rule/AbstractRule.php
      - exact: src/Analysis/Evidence/Measurement/Contract/AbstractCollector.php

  cohesion.lcom:
    warning: 5
    error: 5

  design.dit:
    warning: 4
    error: 4

  design.god-class:
    suppress_paths:
      - subtree: src/Reporting/Formatter/Health

  # --- Maintainability ---
  maintainability.mi:
    warning: 35
    error: 35

  size.method-count:
    warning: 20
    error: 20

  # Health debt is ratcheted in qmx-baseline.json; new regressions fail selfcheck.
  health.cohesion:
    suppress_paths:
      # Collector metadata operations and abstractness calculation use no shared
      # instance fields; the lifecycle concerns one stateless metric collector.
      - exact: src/Analysis/Evidence/Coupling/AbstractnessCollector.php
      # Serializer identity, availability and native encode/decode implement one
      # stateless codec protocol without shared instance fields.
      - exact: src/Infrastructure/Serializer/IgbinarySerializer.php
      # Immutable spelling and namespace-prefix projections expose the same bound
      # type vocabulary through separate lookup maps.
      - exact: src/Analysis/Policy/Architecture/Layer/ClassContext/NameSpellingIndex.php
      # Early input refusal and post-run finding projection are separate phases
      # of the same Console invocation adapter.
      - exact: src/Infrastructure/Console/FindingFilterOrchestrator.php
      # ResolvedTarget retains judged membership, path spelling and identity facts;
      # its lookups read independent parts of that immutable target snapshot.
      - exact: src/Core/FileTarget/ResolvedTarget.php
      # Immutable ceiling outcome lookups read independent acceptance, scope and
      # comparison facts.
      - exact: src/Analysis/Policy/Baseline/Contract/CeilingOutcome.php
      # Immutable duplication options separate static declaration and resolved
      # construction from independent enablement and severity facts.
      - exact: src/Analysis/Evidence/Duplication/CodeDuplicationOptions.php
      # The readonly snapshot has independent live and provenance observations over coherent facts.
      - exact: src/Analysis/Finding/Contract/EnablementDecision.php
      # ConfigurationRefusal retains independent origin, position, summary and cause
      # facts. Static factories and refusal formatting do not establish shared
      # instance-field usage.
      - exact: src/Analysis/Configuration/Contract/Refusal/ConfigurationRefusal.php
    suppress_namespace_channels:
      health.cohesion:
        # Stateless expansion algorithms and their immutable result do not share
        # fields; cohesion is structurally inapplicable only to this exact root.
        - exact: 'Qualimetrix\Analysis\Policy\Architecture\Layer\Expansion'
        # The namespace health aggregate combines independent Debt and Impact
        # subjects whose instance fields belong to separate lifecycles.
        - exact: 'Qualimetrix\Analysis\Evidence\Prioritization'
