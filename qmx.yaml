# Qualimetrix — project configuration (dogfooding)
#
# We analyze ourselves with our own tool. This config tunes thresholds
# and documents structural exceptions; qmx-baseline.json ratchets residual debt.
#
# Decision framework for violations:
# 1. Real issue? → Fix the code
# 2. Structural (project nature)? → exclude_paths or exclude_namespaces
# 3. Threshold mismatch? → Tune threshold
# 4. One-off exception? → @qmx-threshold on the class/method
# 5. Genuinely inapplicable? → @qmx-ignore with reason

# Fail CI on errors only (warnings are informational)
failOn: error

# Self-analysis with duplication detection needs more memory
memory_limit: 1G

# Coupling: mark vendor dependencies as framework
coupling:
  framework-namespaces:
    - Symfony
    - PhpParser
    - Psr
    - Amp

# Architecture: generated modular-architecture coarse enforcement projection.
#
# The live topology contains 37 semantic-owner layers and no singleton seams:
# 37 internal enforcement layers, or 38 including `external`. Membership and
# 224 allows are generated from the internal manifest and production AST.
#
# qmx layers intentionally enforce only the coarse owner/seam DAG. Exact
# internal visibility, contract consumers and temporary source-to-target grants
# are validated by `composer architecture:check` before self-analysis; a coarse
# qmx allow never authorises an unlisted exact import.
#
# Declaration order still matters (ADR 0006: first match wins). Generated FQCN
# patterns are exact and the final external catch-all excludes Qualimetrix\**,
# so new project declarations fail coverage until the manifest is reviewed.
# BEGIN GENERATED MODULAR ARCHITECTURE - DO NOT EDIT
