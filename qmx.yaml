  coverage: error
# END GENERATED MODULAR ARCHITECTURE

rules:
  # --- Architecture ---

  # The three layer diagnostics default to info/warning so that adopting the
  # rule never breaks an existing build. For our own topology the opposite is
  # right: a layer that captures nothing, a layer shadowed by an earlier one,
  # or a template that expands to nothing is always a typo in `patterns:` —
  # exactly the failure the diagnostics exist to catch. Fail the build on it.
  architecture.layer-violation:
    severity: error
    unreachable_layer_severity: error
    potential_shadow_severity: error
    empty_template_severity: error

  # --- Coupling ---

  # Core value objects are coupling magnets by design — every domain depends on them.
  coupling.cbo:
    exclude_namespaces:
      - Qualimetrix\Analysis\Finding\Contract
      - Qualimetrix\Core\Symbol
      - Qualimetrix\Core\Metric
      - Qualimetrix\Analysis\Finding\Rule
      - Qualimetrix\Core\Path
      # A former role-root prefix used to silence 85 classes to hide exactly one
      # violation — AbstractRule (CBO 39), whose coupling really is structural
      # because it aggregates every subclass dependency. The precise path below
      # keeps the remaining classes measured.
    exclude_namespace_channels:
      coupling.cbo.namespace:
        # This exact public-contract namespace replaces four broad historical
        # consumer namespaces with five mandatory ADR 0022 named capability
        # consumers. Namespace-union granularity raises CBO by one although
        # executable importer count falls; declaration-level class CBO remains active.
        - '[Q]ualimetrix\Analysis\Configuration\Contract'
        # Raw 18 is the required union of eight inbound and twelve outbound
        # Inline contract dependencies. Exact channel scope keeps declaration
        # CBO, children, and every other coupling channel active.
        - '[Q]ualimetrix\Analysis\Policy\Inline\Contract'
    exclude_paths:
      # The graph contract is intentionally a widely consumed type hub. Keep this
      # exact declaration measured by other rules without excluding its siblings.
      - src/Analysis/Evidence/DependencyModel/Contract/DependencyGraphInterface.php
      # AST visitors depend on many php-parser node types (not actionable coupling).
      # Exact capability roots preserve the visitor exclusion without enrolling
      # a future Analysis/Evidence sibling.
      - src/Analysis/Evidence/CodeSmell/*Visitor.php
      - src/Analysis/Evidence/Cohesion/*Visitor.php
      - src/Analysis/Evidence/Complexity/*Visitor.php
      - src/Analysis/Evidence/Coupling/*Visitor.php
      - src/Analysis/Evidence/Design/*Visitor.php
      - src/Analysis/Evidence/Maintainability/*Visitor.php
      - src/Analysis/Evidence/Security/*Visitor.php
      - src/Analysis/Evidence/Size/*Visitor.php
      - src/Analysis/Finding/Contract/Rule/AbstractRule.php
      - src/Analysis/Finding/Contract/Rule/ThresholdParser.php
      # DI configurators wire all services (coupling is their job)
      - src/Infrastructure/DependencyInjection
      # Infrastructure console commands and pipeline orchestrators need many deps
      - src/Infrastructure/Console
      - src/Analysis/Run/Pipeline
    namespace:
      warning: 16
      error: 25
    class:
      warning: 20
      error: 30

  # Core contracts and value objects are coupling hubs by design.
  coupling.class-rank:
    exclude_namespaces:
      - Qualimetrix\Analysis\Finding\Contract
      - Qualimetrix\Core\Symbol
      - Qualimetrix\Core\Metric
      - Qualimetrix\Analysis\Finding\Rule
      - Qualimetrix\Core\Dependency
      - Qualimetrix\Analysis\Evidence\DependencyModel\Contract
      - Qualimetrix\Core\Path

  # Distance: leaf namespaces holding pure value objects, enums, and exceptions
  # are maximally concrete with few abstractions — that is the point of a
  # domain-VO sub-namespace. The P4 Layer root contains the Architecture leaf's
  # immutable layer values and its expansion implementation (ADR 0022).
  #
  # Note on scope: plain `exclude_namespaces` entries match by prefix, so the two
  # entries below are blankets — `Qualimetrix\Core` covers the whole
  # Core tree (including the umbrella namespace itself, D=0.71) and the P4
  # Layer root deliberately covers its Expansion child. Configuration/Allow is
  # a separate concrete selector/value/parser leaf, so it has its own prefix.
  # The character-class form used
  # for DependencyModel matches the exact owner root without prefix-enrolling its
  # healthy Contract child.
  coupling.distance:
    exclude_namespaces:
      - Qualimetrix\Core
      - Qualimetrix\Analysis\Policy\Architecture\Layer
      - Qualimetrix\Analysis\Policy\Architecture\Configuration\Allow
      - Qualimetrix\Analysis\Evidence\Prioritization\Debt
      - Qualimetrix\Infrastructure\Serializer
      - Qualimetrix\Reporting\Formatter\Support
      # The stable public contract plus internal graph implementations makes the
      # owner-root distance structural; `[Q]` avoids excluding the Contract child.
      - '[Q]ualimetrix\Analysis\Evidence\DependencyModel'
      # Immutable score values form a stable concrete contract leaf. Its exact
      # namespace has A=0/I=0 by design; `[Q]` prevents descendant enrollment.
      - '[Q]ualimetrix\Analysis\Evidence\ComputedMetrics\Health\Contract\Score'
      # Concrete metadata catalogs implement a sibling Contract-owned public
      # surface. Exact-namespace abstractness therefore cannot see that port.
      - '[Q]ualimetrix\Analysis\Evidence\ComputedMetrics\Health\Metadata'
      # Internal evidence, reason projection, and offender construction are a
      # concrete subject with no external production consumer for an abstraction.
      # `[Q]` keeps the exclusion exact and leaves sibling Health namespaces active.
      - '[Q]ualimetrix\Analysis\Evidence\ComputedMetrics\Health\Offender'
      # Analysis is a navigation taxonomy with no declaration; its raw
      # D=0.5947498097757165 aggregates independently owned leaf capabilities.
      - '[Q]ualimetrix\Analysis'
      # This navigation root owns no declaration and unites independent Debt
      # and Impact subjects; the exact-root raw distance is 0.5294117647058824.
      - '[Q]ualimetrix\Analysis\Evidence\Prioritization'
      # Finding deliberately combines a stable Contract subtree with a small
      # internal service set; the exact-root aggregate distance is 0.6641604010025063.
      - '[Q]ualimetrix\Analysis\Finding'
      # This public-surface root unions independently consumed Finding
      # contracts; its exact-root aggregate distance is 0.6209039548022599.
      - '[Q]ualimetrix\Analysis\Finding\Contract'
      # The rule contract language combines interfaces, immutable values,
      # enums, readers, and selectors; exact-root distance is 0.505982905982906.
      - '[Q]ualimetrix\Analysis\Finding\Contract\Rule'
      # Concrete validators implement an externally consumed override language,
      # making local A/I incomplete; exact-root distance is 0.7375.
      - '[Q]ualimetrix\Analysis\Finding\Contract\Rule\Override'
    max_distance_warning: 0.5
    max_distance_error: 0.7

  coupling.instability:
    exclude_namespace_channels:
      coupling.instability.namespace:
        # This delivery-adapter namespace has Ca=3 / Ce=31: three inward
        # composition/runtime seams and 31 necessary outward capability,
        # framework, serialization, and process dependencies. Its I=0.911765
        # measures the adapter role rather than an unstable promised abstraction.
        - '[Q]ualimetrix\Infrastructure\Parallel'
    exclude_paths:
      # Note: visitors and DI configurators are NOT listed here. They are indeed
      # inherently unstable, but `min_afferent: 2` below already filters them out
      # (they have Ca=1), so path entries for them were pure no-ops — measured, then
      # removed. The entries that remain each suppress a real violation.
      - src/Analysis/Evidence/CodeSmell/UsageTrackingTrait.php
      - src/Analysis/Evidence/Cohesion/ClassVisitorStackTrait.php
      # Console commands/orchestrators sit at the top of the stack: I→1 is correct there
      - src/Infrastructure/Console
      # Abstract base classes aggregate deps from all subclasses — instability is structural.
      # AbstractRule is a representative path for its namespace-level structural
      # instability, so renaming it intentionally brings the signal back for review.
      - src/Analysis/Finding/Contract/Rule/AbstractRule.php
    class:
      min_afferent: 2
    namespace:
      min_afferent: 2
      max_warning: 0.9
      max_error: 1.0

  # --- Complexity ---

  # AST visitors inherently have high NPath/CCN/WMC due to many node type branches.
  # This is structural complexity from matching PHP AST node types, not a design flaw.
  #
  # Scope note: these four rules used to exclude whole role trees plus
  # `src/Reporting/Health`, `src/Analysis/Pipeline`, and `src/Baseline`, while the
  # justification above only ever covered visitors. Of the 43 files hiding under them,
  # 16 were real visitors and 27 were not — the exclusions were burying ~79 genuine
  # violations, 21 of them error-level. Those files were refactored instead (see
  # ThresholdParser, LcomClassData, GodClassRule, DataClassRule, the Summary renderers,
  # DuplicationDetector, ComputedMetricEvaluator), and the lists below are now narrowed
  # to what the justification actually says. Two methods that genuinely measure table
  # size rather than decision depth carry a per-symbol `@qmx-threshold` instead
  # (SarifRuleCollector::getRuleDescription, MetricEnricher::enrich).
  # The two exact trait paths do the same AST node-type dispatch without carrying
  # the Visitor suffix.
  complexity.npath:
    exclude_paths:
      - src/Analysis/Evidence/CodeSmell/*Visitor.php
      - src/Analysis/Evidence/Cohesion/*Visitor.php
      - src/Analysis/Evidence/Complexity/*Visitor.php
      - src/Analysis/Evidence/Coupling/*Visitor.php
      - src/Analysis/Evidence/Design/*Visitor.php
      - src/Analysis/Evidence/Maintainability/*Visitor.php
      - src/Analysis/Evidence/Security/*Visitor.php
      - src/Analysis/Evidence/Size/*Visitor.php
      - src/Analysis/Evidence/CodeSmell/UsageTrackingTrait.php
      - src/Analysis/Evidence/Cohesion/ClassVisitorStackTrait.php

  # Code duplication: Options classes share fromArray/threshold patterns by convention.
  # Raised min_tokens from 70→100 to reduce structural similarity false positives.
  # The MetricHintProvider entry was removed once the rule stopped reporting duplicates
  # that lie entirely inside constant data tables — its 22 hits were all inside
  # `const array METRICS`/`RANGES`, so the exclusion is now a no-op (verified: zero delta).
  duplication.code-duplication:
    min_tokens: 100
    exclude_paths:
      - src/Analysis/Evidence/CodeSmell/*Options.php
      - src/Analysis/Evidence/Cohesion/*Options.php
      - src/Analysis/Evidence/Complexity/*Options.php
      - src/Analysis/Evidence/Coupling/*Options.php
      - src/Analysis/Evidence/Design/*Options.php
      - src/Analysis/Evidence/Maintainability/*Options.php
      - src/Analysis/Evidence/Security/*Options.php
      - src/Analysis/Evidence/Size/*Options.php
      - src/Analysis/Evidence/Duplication/CodeDuplicationOptions.php
      - src/Analysis/Evidence/Complexity/CognitiveComplexityVisitor.php

  complexity.cyclomatic:
    exclude_paths:
      - src/Analysis/Evidence/CodeSmell/*Visitor.php
      - src/Analysis/Evidence/Cohesion/*Visitor.php
      - src/Analysis/Evidence/Complexity/*Visitor.php
      - src/Analysis/Evidence/Coupling/*Visitor.php
      - src/Analysis/Evidence/Design/*Visitor.php
      - src/Analysis/Evidence/Maintainability/*Visitor.php
      - src/Analysis/Evidence/Security/*Visitor.php
      - src/Analysis/Evidence/Size/*Visitor.php
      - src/Analysis/Evidence/CodeSmell/UsageTrackingTrait.php
      - src/Analysis/Evidence/Cohesion/ClassVisitorStackTrait.php

  complexity.wmc:
    exclude_paths:
      - src/Analysis/Evidence/CodeSmell/*Visitor.php
      - src/Analysis/Evidence/Cohesion/*Visitor.php
      - src/Analysis/Evidence/Complexity/*Visitor.php
      - src/Analysis/Evidence/Coupling/*Visitor.php
      - src/Analysis/Evidence/Design/*Visitor.php
      - src/Analysis/Evidence/Maintainability/*Visitor.php
      - src/Analysis/Evidence/Security/*Visitor.php
      - src/Analysis/Evidence/Size/*Visitor.php

  complexity.cognitive:
    exclude_paths:
      - src/Analysis/Evidence/CodeSmell/*Visitor.php
      - src/Analysis/Evidence/Cohesion/*Visitor.php
      - src/Analysis/Evidence/Complexity/*Visitor.php
      - src/Analysis/Evidence/Coupling/*Visitor.php
      - src/Analysis/Evidence/Design/*Visitor.php
      - src/Analysis/Evidence/Maintainability/*Visitor.php
      - src/Analysis/Evidence/Security/*Visitor.php
      - src/Analysis/Evidence/Size/*Visitor.php

  # --- Code Smells ---

  # No exclusions needed: the rule itself no longer flags promoted constructor
  # properties (a promoted param is a field declaration, not a behavior switch),
  # so the whole-tree exclusions this block used to carry — src/Core, src/Reporting,
  # src/Infrastructure/Console, src/Architecture/Domain, the *Options.php globs —
  # became pure compensation for a rule-level false positive and were removed.
  # They were also hiding ~23 genuine boolean arguments, which are now visible.
  code-smell.boolean-argument:
    allowed_prefixes: [is, has, can, should, will, did, was]

  code-smell.error-suppression:
    allowed_functions:
      - file_get_contents
      - file_put_contents
      - fopen
      - unlink
      - mkdir
      - rename
      - rmdir
      - json_decode
      - token_get_all
      - proc_open
      - hash_file
      - igbinary_serialize
      - igbinary_unserialize
      - unserialize

  # Data-carrying objects and pipeline services need many constructor params.
  # This is a natural pattern for immutable VOs, not a design smell.
  code-smell.long-parameter-list:
    warning: 8
    error: 12
    exclude_paths:
      - src/Reporting/Report.php
      - src/Reporting/FormatterContext.php
      - src/Reporting/Health/WorstOffender.php
      - src/Analysis/Collection/CollectedFileData.php
      - src/Analysis/Evidence/DependencyModel/DependencyGraph.php
      - src/Analysis/Run/Contract/Collection/FileProcessingResult.php
      - src/Analysis/Run/Contract/Collection/SuccessfulFileProcessing.php
      - src/Analysis/Run/Pipeline/AnalysisPipeline.php
      - src/Infrastructure/Console/Command/CheckCommand.php
      - src/Infrastructure/Console/ResultPresenter.php
      - src/Infrastructure/Parallel/Strategy/StrategySelector.php
      - src/Core/Profiler/Span.php
      - src/Analysis/Finding/Contract/Violation.php

  code-smell.constructor-overinjection:
    exclude_paths:
      - src/Reporting/Report.php
      - src/Reporting/FormatterContext.php
      - src/Analysis/Run/Contract/Collection/SuccessfulFileProcessing.php

  code-smell.unreachable-code:
    warning: 1
    error: 1

  # MethodCountMetrics tracks many per-class counts (each is a separate property)
  size.property-count:
    warning: 15
    error: 15
    exclude_paths:
      - src/Analysis/Evidence/Size/MethodCountMetrics.php

  # --- Design ---

  # AbstractRule and AbstractCollector have many children — this is by design
  # (one rule/collector per metric category).
  design.noc:
    warning: 10
    error: 10
    exclude_paths:
      - src/Analysis/Finding/Contract/Rule/AbstractRule.php
      - src/Analysis/Evidence/Measurement/Contract/AbstractCollector.php

  # Mutable runtime stores intentionally expose state accessors rather than
  # domain behaviour; this exact path keeps the exception local to that role.
  design.data-class:
    exclude_paths:
      - src/Analysis/Evidence/Measurement/Runtime/CollectorRuntimeConfigurationStore.php

  design.lcom:
    warning: 5
    error: 5
    exclude_paths:
      - src/Reporting/Health
      # Derived metric collectors are thin wrappers (low cohesion by nature)
      - src/Analysis/Evidence/Coupling/*Collector.php

  design.inheritance:
    warning: 4
    error: 4

  design.god-class:
    exclude_paths:
      - src/Reporting/Health
      - src/Reporting/Formatter/Health
      - src/Analysis/Evidence/Coupling/CboRule.php

  # --- Maintainability ---
  maintainability.index:
    warning: 35
    error: 35

  size.method-count:
    warning: 20
    error: 20

  # Health debt is ratcheted in qmx-baseline.json; new regressions fail selfcheck.
  computed.health:
    enabled: true
    exclude_namespace_channels:
      health.cohesion:
        # Coupling collectors expose independent graph calculations; shared-field
        # cohesion is structurally inapplicable to this namespace-level category.
        - Qualimetrix\Analysis\Evidence\Coupling
        # The root recursively includes the intentionally data-shaped graph; the
        # `[Q]` exact-root glob keeps the healthy Contract child under analysis.
        - '[Q]ualimetrix\Analysis\Evidence\DependencyModel'
