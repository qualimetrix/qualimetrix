  coverage-gap: error
# END GENERATED MODULAR ARCHITECTURE

rules:
  # --- Architecture ---

  # The four sibling layer diagnostics (coverage, unreachable-layer,
  # potential-shadow, empty-template) no longer take a severity here: they
  # report a configuration error, so they fail the build unconditionally and
  # cannot be accepted by the ratchet. Only the edge violations this rule
  # reports as code debt still have a severity to choose.
  architecture.layer-violation:
    severity: error

  # --- Coupling ---

  # Core value objects are coupling magnets by design — every domain depends on them.
  coupling.cbo:
    suppress_namespaces:
      - subtree: Qualimetrix\Analysis\Finding\Contract
      # The configuration-refusal carrier: ConfigurationRefusal itself plus
      # the three value types it composes (ADR 0050). Five capability owners
      # and the console throw or catch this one type, which is what a
      # contract is for; CBO counts exactly that reach and calls it a magnet.
      # Measured after X15: ConfigurationRefusal 50, ConfigurationOrigin 44,
      # ConfigurationSource 44 against a class error bound of 30 — every
      # point of it inbound, from owners that are supposed to name it.
      # Blanket by prefix, and deliberately so: this exact sub-namespace
      # holds nothing but the carrier's own value types, and a future
      # sibling there would be one of them. Scoped to `\Refusal` and not to
      # the parent `\Contract` namespace it lives under — X15's review found
      # the wider prefix silently also suppressing four unrelated,
      # unmeasured types (`ConfigurationDocument`, `KnownRuleNamesProviderInterface`,
      # `Discovery\ComposerAutoloadPathReaderInterface`,
      # `Pipeline\ConfigurationPipelineInterface`,
      # `Pipeline\ConfigurationResolutionRequest`); re-measured after
      # narrowing to just `\Refusal` and only `ConfigurationDocument` of
      # those five turned out to actually exceed the threshold (see below) —
      # the other four are unsuppressed and clean.
      - subtree: Qualimetrix\Analysis\Configuration\Contract\Refusal
      # Reconfirmed 2026-08-26 for a namespace that grew: SymbolLevel and its
      # projection moved in here (rule-vocabulary plan Ш5e2b). This line decides
      # publication, not detection: a point threshold inside the namespace still
      # decides whether a hub is reported at all, hence whether it shows up under
      # `--show-suppressed` and in the suppression count. Measured cost of
      # narrowing this to point thresholds instead: four classes here exceed the
      # class CBO threshold (SymbolPath 72, MetricSubject 46, SymbolType 35,
      # SymbolInfo 33), the namespace union exceeds its own (55), and two classes
      # exceed ClassRank. Decided 2026-08-26 not to narrow: a point threshold
      # inside an excluded namespace still decides detection, so narrowing would
      # redistribute the silencing rather than add measurement — and the namespace
      # union it leaves behind is not addressable by a point threshold at all.
      # Owner closed the question on 2026-09-01: this line stands as measured,
      # and nothing further is owed to it.
      - subtree: Qualimetrix\Core\Symbol
      - subtree: Qualimetrix\Core\Path
    suppress_namespace_channels:
      coupling.cbo:namespace:
        # This exact public-contract namespace replaces four broad historical
        # consumer namespaces with five mandatory ADR 0022 named capability
        # consumers. Namespace-union granularity raises CBO by one although
        # executable importer count falls; declaration-level class CBO remains active.
        - exact: 'Qualimetrix\Analysis\Configuration\Contract'
        # Raw 18 is the required union of eight inbound and twelve outbound
        # Inline contract dependencies. Exact channel scope keeps declaration
        # CBO, children, and every other coupling channel active.
        - exact: 'Qualimetrix\Analysis\Policy\Inline\Contract'
        # Shared exact/subtree/regex primitives intentionally form one neutral
        # vocabulary used by configuration, analysis, reporting, and console
        # adapters. The namespace union is 21 after the bound selector contract
        # landed; declaration-level CBO and every other coupling channel remain
        # active, so only this namespace-granularity hub finding is excluded.
        - exact: 'Qualimetrix\Core\Pattern'
        # Summary renderers compose the stable report/context boundary with
        # finding, debt, filtering, health, and ANSI vocabularies. The namespace
        # union is 16 after FormatterContext gained the bound selector; class
        # CBO and every other coupling channel remain active.
        - exact: 'Qualimetrix\Reporting\Formatter\Summary'
        # The Reporting vocabulary root, 16 against an inclusive 16. This is
        # the same namespace-granularity artefact the
        # `Analysis\Configuration\Contract` entry in this list records, and
        # here the run says so outright: `coupling.cbo` moves 15 -> 16
        # while `coupling.ca` (12) and `coupling.ce` (57) do not move at all.
        # No class gained or lost an edge; only the number of namespaces those
        # same edges are spread over changed. Measured with
        # `bin/qmx check src/ --format=metrics`, both sides, on the commit this
        # change starts from and on the result.
        #
        # The cause is retiring the `Formatter\Support` bucket, which replaced
        # one importing namespace with two: `Formatter\Detail\FindingDetailRenderer`
        # and `Formatter\Ordering\FindingSorter` named `GroupBy` and
        # `FormatterContext` from inside `Support` before and name the same two
        # types from their own subjects now. That part is counted from imports
        # rather than read off the graph, so it is offered as the explanation
        # of a delta the tool reports, not as a reconstruction of the metric.
        #
        # The counterfactual of removing this entry is putting the bucket back,
        # so no refactoring is offered. Moving `GroupBy` down into `Ordering`
        # was rejected on a count rather than a run: eleven namespaces name
        # that enum, so it would turn a leaf into a hub and add an edge from
        # this root besides. Exact channel scope keeps declaration-level class
        # CBO, every child namespace, and every other coupling channel active.
        - exact: 'Qualimetrix\Reporting'
        # The configuration hub, union 16 against an inclusive 16. The one edge
        # that moved it from 15 is afferent, and it is X18's own cure:
        # `Evidence\Coupling\CouplingAnalysis` stopped throwing a bare
        # `InvalidArgumentException` and now names `ConfigSchema` and
        # `ConfigurationRefusal` so a bad coupling option is refused under the
        # `Configuration error:` framing. Measured, not assumed: the afferent
        # namespace set goes 14 -> 15 and the single new member is
        # `Analysis\Evidence\Coupling`; drop that one import and the union is
        # back at 15, under the ceiling. The counterfactual of removing it is
        # therefore exactly "undo the cure", which is why no refactoring is
        # offered here. A point `@qmx-threshold` does not address this: the
        # subject is `ns:Qualimetrix\Analysis\Configuration`, and a tag on the
        # file the finding is attributed to was probed on this tree -- the
        # violation stood and `bin/qmx directives` reported the directive inert.
        # Exact channel scope keeps declaration-level class CBO, every child
        # namespace and every other coupling channel measured.
        - exact: 'Qualimetrix\Analysis\Configuration'
        # The formatter namespace, union 16 against an inclusive 16, and the
        # same shape: the edge that moved it from 15 is afferent, from
        # `Reporting\Configuration\OutputFormatResolver`, which now names
        # `FormatterRegistryInterface` to judge an output format against the
        # registered formatters; at 72f18239 it wrapped whatever string it was
        # given in an `OutputFormat` and checked nothing. Measured: the
        # efferent namespace set is unchanged at 6 and the afferent set goes
        # 9 -> 10 with that one new member, so 6 + 10 = 16. Note this corrects
        # the efferent reading the rule's message suggests -- the breach is on
        # the inbound half. Point thresholds do not reach a namespace subject
        # (probed as above), and removing the edge means undoing X18's cure:
        # the resolver was given the registry so an unknown output format is
        # refused under the `Configuration error:` framing. No refactoring is
        # offered here for the same reason as the entry above.
        - exact: 'Qualimetrix\Reporting\Formatter'
        # The Measurement contract namespace, whose union is 47 against a
        # threshold of 25 — measured 2026-09-21, and the number is a dated
        # measurement rather than a ceiling, because this channel is suppressed
        # outright for this namespace. It was ratcheted at 44. The one edge that
        # moved it to 45 is `Infrastructure\DependencyInjection\CompilerPass`: the channel
        # compiler pass now reads `MetricName`'s constants by reflection to
        # check at build time that a channel's declared judged metric exists
        # (ADR 0046), and the union is counted at namespace granularity, so one
        # new importing namespace is one edge. Measured: reverting the second
        # new importer (`HealthDimensionCatalog`) leaves the union at 45, so it
        # is this namespace alone. Two importing namespaces joined after that.
        # The one this file can attribute is the 47th, `Reporting\DrillDown`:
        # `DrillDownBinding` moved there to sit beside the `FindingFilter` its
        # docblock says it must agree with, and it reads this repository through
        # `MetricRepositoryInterface` and `NamespaceTree`. `Infrastructure\Console`
        # did not leave the union with it — `LayerAssignmentResolver` still
        # imports from here — which is why the step is +1 and not 0. The 46th
        # predates that move and is not attributed here. The check cannot move
        # anywhere cheaper —
        # every namespace already in the union is an analysis capability, not a
        # composition root — and a namespace channel is not addressable by
        # `@qmx-threshold`. Class CBO inside this namespace stays measured:
        # `MetricName`, `MetricBag`, `AbstractCollector` and the rest each keep
        # their own point threshold.
        - exact: 'Qualimetrix\Analysis\Evidence\Measurement\Contract'
    suppress_paths:
      # The graph contract is intentionally a widely consumed type hub. Keep this
      # exact declaration measured by other rules without excluding its siblings.
      - exact: src/Analysis/Evidence/DependencyModel/Contract/DependencyGraphInterface.php
      # AST visitors depend on many php-parser node types (not actionable coupling).
      # Exact capability roots preserve the visitor exclusion without enrolling
      # a future Analysis/Evidence sibling.
      # Depth inside a capability root is deliberately not an axis. PathMatcher globs
      # through fnmatch without FNM_PATHNAME, so `*` crosses `/` and these patterns
      # kept matching after Design was split into subject folders. That is the chosen
      # behaviour, not an accident to be pinned back: the enrolment this list guards
      # against is a future sibling capability, while a subject folder inside an
      # already-excluded capability is that capability's own business. Pinning the
      # globs per subject would also mean editing every rule block below for each
      # new subject, which is the cost this shape buys off.
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Complexity/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Coupling/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Design/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Security/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Size/.*Visitor\.php'
      # DI configurators wire all services (coupling is their job)
      - subtree: src/Infrastructure/DependencyInjection
      # Infrastructure console commands and pipeline orchestrators need many deps
      - subtree: src/Infrastructure/Console
      - subtree: src/Analysis/Run/Pipeline
      # `ConfigurationDocument`, which the `\Refusal` entry above deliberately
      # does not sweep in: the shared configuration document every capability's
      # resolver reads to build its own view. Measured on this tree: CBO 27
      # against the class thresholds below (`warning: 20, error: 30`) — past
      # the warning bound and reported as `warning`, a connectivity magnet for
      # the same reason as the carrier, many named readers of one document, but
      # a distinct type, so it carries its own line and its own number. Written
      # as a path because `suppress_namespaces` matches namespaces, and a class
      # name written there matches nothing — measured: the entry looked right
      # and suppressed nothing.
      - exact: src/Analysis/Configuration/Contract/ConfigurationDocument.php
    namespace:
      warning: 16
      error: 25
    class:
      warning: 20
      error: 30

  # Core contracts and value objects are coupling hubs by design.
  coupling.class-rank:
    suppress_namespaces:
      - subtree: Qualimetrix\Analysis\Finding\Contract
      # Same reconfirmation as for the CBO channel above: the level vocabulary now
      # lives here, so its ClassRank is unpublished too (rule-vocabulary Ш5e2b).
      - subtree: Qualimetrix\Core\Symbol
      - subtree: Qualimetrix\Analysis\Finding\Rule
      - subtree: Qualimetrix\Analysis\Evidence\DependencyModel\Contract
      - subtree: Qualimetrix\Core\Path
      # X15's entry for the refusal carrier's own namespace is gone. It was
      # added on a measurement — ConfigurationSource at 0.0071 against 0.0066 —
      # that X16 invalidated when the carrier grew one shortcut per form and
      # source: a call site now names one type instead of three, ConfigurationSource
      # lost the inbound edges its rank came from, and the entry suppressed
      # nothing. `docs/internal/generated/suppression/inert.tsv` is the oracle
      # that said so, and a suppressor under which nothing is suppressed is the
      # very thing this round exists to report.

  # Distance: leaf namespaces holding pure value objects, enums, and exceptions
  # are maximally concrete with few abstractions — that is the point of a
  # domain-VO sub-namespace. The Analysis.Policy.Architecture Layer root holds
  # that leaf's immutable layer values and its expansion implementation
  # (ADR 0022).
  #
  # Note on scope: plain `suppress_namespaces` entries match by prefix, so the two
  # entries below are blankets — `Qualimetrix\Core` covers the whole
  # Core tree (including the umbrella namespace itself, D=0.71) and the
  # Analysis.Policy.Architecture Layer root deliberately covers its Expansion
  # child. Configuration/Allow is a separate concrete selector/value/parser
  # leaf, so it has its own prefix.
  coupling.distance:
    suppress_namespaces:
      - subtree: Qualimetrix\Core
      - subtree: Qualimetrix\Analysis\Policy\Architecture\Layer
      - subtree: Qualimetrix\Analysis\Policy\Architecture\Configuration\Allow
      - subtree: Qualimetrix\Analysis\Evidence\Prioritization\Debt
      - subtree: Qualimetrix\Infrastructure\Serializer
      # Immutable score values form a stable concrete contract leaf. Its exact
      # namespace has A=0/I=0 by design; `[Q]` prevents descendant enrollment.
      - exact: 'Qualimetrix\Analysis\Evidence\ComputedMetrics\Health\Contract\Score'
      # Concrete metadata catalogs implement a sibling Contract-owned public
      # surface. Exact-namespace abstractness therefore cannot see that port.
      - exact: 'Qualimetrix\Analysis\Evidence\ComputedMetrics\Health\Metadata'
      # Internal evidence, reason projection, and offender construction are a
      # concrete subject with no external production consumer for an abstraction.
      # `[Q]` keeps the exclusion exact and leaves sibling Health namespaces active.
      - exact: 'Qualimetrix\Analysis\Evidence\ComputedMetrics\Health\Offender'
      # This navigation root owns no declaration and unites independent Debt
      # and Impact subjects; the exact-root raw distance is 0.5294117647058824.
      - exact: 'Qualimetrix\Analysis\Evidence\Prioritization'
      # Finding deliberately combines a stable Contract subtree with a small
      # internal service set; the exact-root aggregate distance is 0.6641604010025063.
      - exact: 'Qualimetrix\Analysis\Finding'
      # This public-surface root unions independently consumed Finding
      # contracts; its exact-root aggregate distance is 0.6209039548022599.
      - exact: 'Qualimetrix\Analysis\Finding\Contract'
      # The rule contract language combines interfaces, immutable values,
      # enums, readers, and selectors; exact-root distance is 0.505982905982906.
      - exact: 'Qualimetrix\Analysis\Finding\Contract\Rule'
      # Concrete validators implement an externally consumed override language,
      # making local A/I incomplete; exact-root distance is 0.7375.
      - exact: 'Qualimetrix\Analysis\Finding\Contract\Rule\Override'
      # The threshold penalizes consolidation itself here, and that is measured
      # rather than argued. Four copies of the retired-suppression vocabulary
      # were folded into one owner, which is the only direction the manifest
      # allows: `Analysis\Finding` already imports `Analysis\Configuration`, so
      # the reverse edge would be a cycle. Folding them adds afferent edges and
      # nothing else — abstractness is unchanged, instability falls to 4/38, and
      # D = |A + I - 1| rises for that reason alone. The counterfactual was
      # measured, not assumed: leaving the spelling fold in `Core` and moving
      # only the vocabulary gives 0.677, over the same ceiling, because the
      # edges are the cause and the class placement is not. Exact-root aggregate
      # distance is 0.686404. `[Q]` keeps every child namespace (Contract,
      # Loader, Pipeline, Preset, Discovery) measured, and a namespace channel
      # is not addressable by `@qmx-threshold` — probed on this tree: a point
      # override on the file the finding is attributed to left the violation
      # standing and the audit reported that directive inert.
      - exact: 'Qualimetrix\Analysis\Configuration'
      # Two exact roots the line above deliberately leaves measured, and X15
      # moved both. `Contract` holds the configuration document and its
      # contracts; the refusal carrier's four value types were added beneath
      # it (ADR 0050), which lowers the parent's abstractness by four concrete
      # classes: 0.60 against a 0.5 ceiling. The child root is the extreme case
      # of the same shape — a final exception plus three `final readonly`
      # values, A=0 by construction, and every capability owner now names it,
      # so I approaches 1 and D = |A + I - 1| approaches 1 with it: 0.98. There
      # is no refactoring that lowers it while the type stays a contract; an
      # abstract seam in front of an exception's factory methods would buy the
      # number and cost the reader.
      - exact: 'Qualimetrix\Analysis\Configuration\Contract'
      - exact: 'Qualimetrix\Analysis\Configuration\Contract\Refusal'
    max_distance_warning: 0.5
    max_distance_error: 0.7

  coupling.instability:
    suppress_namespace_channels:
      coupling.instability:namespace:
        # Ca=3 / Ce=62 (I=0.953846), ratcheted at 0.953125 when Ce was 61. The
        # one new efferent class is `Analysis\Finding\Contract\JudgedMetrics`,
        # which each judging rule in this package names in its own channel
        # declaration (ADR 0046). A leaf evidence capability is efferent by its
        # nature — its rules and collectors depend outward on the Finding
        # vocabulary, the Measurement contract and the Core symbols, while only
        # three classes anywhere depend on it inward — so every future addition
        # to the declaration vocabulary crosses this again by the same
        # mechanism. There is no per-class fix that keeps a rule able to declare
        # what it judges, and a namespace channel is not addressable by
        # `@qmx-threshold`.
        - exact: 'Qualimetrix\Analysis\Evidence\Coupling'
    suppress_paths:
      # Note: visitors and DI configurators are NOT listed here. They are indeed
      # inherently unstable, but `min_afferent: 2` below already filters them out
      # (they have Ca=1), so path entries for them were pure no-ops — measured, then
      # removed. `ClassVisitorStackTrait` is the quiet member of the trait pair the
      # complexity rules exclude by the same reasoning; the rest each suppress a
      # real violation.
      - exact: src/Analysis/Evidence/CodeSmell/UsageTrackingTrait.php
      - exact: src/Analysis/Evidence/Cohesion/ClassVisitorStackTrait.php
      # Console commands/orchestrators sit at the top of the stack: I→1 is correct there
      - subtree: src/Infrastructure/Console
      # Abstract base classes aggregate deps from all subclasses — instability is
      # structural. Its only afferent edges are the three type-coverage subclasses.
      - exact: src/Analysis/Evidence/Design/TypeCoverage/AbstractTypeCoverageRule.php
    class:
      min_afferent: 2
    namespace:
      min_afferent: 2
      max_warning: 0.9
      max_error: 1.0

  # --- Complexity ---

  # AST visitors inherently have high NPath/CCN/WMC due to many node type branches.
  # This is structural complexity from matching PHP AST node types, not a design flaw.
  #
  # Scope note: these four rules used to exclude whole role trees plus
  # `src/Reporting/Health`, `src/Analysis/Pipeline`, and `src/Baseline`, while the
  # justification above only ever covered visitors. Of the 43 files hiding under them,
  # 16 were real visitors and 27 were not — the exclusions were burying ~79 genuine
  # violations, 21 of them error-level. Those files were refactored instead (see
  # ThresholdParser, LcomClassData, GodClassRule, DataClassRule, the Summary renderers,
  # DuplicationDetector, ComputedMetricEvaluator), and the lists below are now narrowed
  # to what the justification actually says. Two methods that genuinely measure table
  # size rather than decision depth carry a per-symbol `@qmx-threshold` instead
  # (SarifRuleCollector::getRuleDescription, MetricEnricher::enrich).
  # The two exact trait paths do the same AST node-type dispatch without carrying
  # the Visitor suffix.
  complexity.npath:
    suppress_paths:
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Complexity/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Coupling/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Design/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Security/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Size/.*Visitor\.php'
      - exact: src/Analysis/Evidence/CodeSmell/UsageTrackingTrait.php
      - exact: src/Analysis/Evidence/Cohesion/ClassVisitorStackTrait.php

  # Code duplication: Options classes share fromArray/threshold patterns by convention.
  # Raised min_tokens from 70→100 to reduce structural similarity false positives.
  # The MetricHintProvider entry was removed once the rule stopped reporting duplicates
  # that lie entirely inside constant data tables — its 22 hits were all inside
  # `const array METRICS`/`RANGES`, so the exclusion is now a no-op (verified: zero delta).
  duplication.clone:
    min_tokens: 100
    suppress_paths:
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Options\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Options\.php'
      - regex: 'src/Analysis/Evidence/Complexity/.*Options\.php'
      - regex: 'src/Analysis/Evidence/Coupling/.*Options\.php'
      - regex: 'src/Analysis/Evidence/Design/.*Options\.php'
      - regex: 'src/Analysis/Evidence/Maintainability/.*Options\.php'
      - regex: 'src/Analysis/Evidence/Security/.*Options\.php'
      - regex: 'src/Analysis/Evidence/Size/.*Options\.php'
      - exact: src/Analysis/Evidence/Duplication/CodeDuplicationOptions.php
      # X16's two new rules live outside `Evidence/`, so the capability roots
      # above do not reach them. Their options classes match each other over a
      # 30-line window that is the mandatory `RuleOptionsInterface` shape and
      # nothing else: a channel-name constant, the `enabled` promoted property,
      # `fromArray()`, `isEnabled()`, `getSeverity()` and `acceptedOptionKeys()`.
      # Everything that differs inside that window is a literal — the channel
      # names — and literals are normalized before matching, which is the same
      # mechanism that put the eight capability roots above on this list. There
      # is no behaviour in the window to extract: a shared base class would hold
      # the interface's own signatures.
      # Only the reported side is listed, the same rule the CboRule entry below
      # states: the detector reports the pair once, and an entry for
      # `Run/ExcludeBinding` beside it was measured inert and left out.
      - regex: 'src/Analysis/Finding/SuppressionBinding/.*Options\.php'
      # CboRule and InstabilityRule match on 34 lines that hold no behaviour: the
      # class line, the five metadata constants every rule must declare, and the
      # name/description/supported-levels accessors the rule interface mandates.
      # Identifiers and literals are normalized before matching, so two rules
      # implementing one interface are indistinguishable from a copy — the same
      # mechanism that put the eight `*Options.php` roots above on this list. The
      # only member inside the window with a body worth sharing is
      # getSupportedLevels(), whose literal differs in three of the five
      # hierarchical rules, so no base class can hold it. The window opened when
      # the retired `requires()` metadata, which used to differ between the two,
      # was deleted; nothing was copied.
      # Only CboRule is listed: the detector reports the pair once, on this side.
      # An InstabilityRule entry beside it was measured as inert and removed.
      - exact: src/Analysis/Evidence/Coupling/CboRule.php

  complexity.ccn:
    suppress_paths:
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Complexity/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Coupling/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Design/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Security/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Size/.*Visitor\.php'
      - exact: src/Analysis/Evidence/CodeSmell/UsageTrackingTrait.php
      - exact: src/Analysis/Evidence/Cohesion/ClassVisitorStackTrait.php

  complexity.wmc:
    suppress_paths:
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Complexity/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Coupling/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Design/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Security/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Size/.*Visitor\.php'

  complexity.cognitive:
    suppress_paths:
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Complexity/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Coupling/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Design/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Security/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Size/.*Visitor\.php'

  # --- Code Smells ---

  # No exclusions needed: the rule itself no longer flags promoted constructor
  # properties (a promoted param is a field declaration, not a behavior switch),
  # so the whole-tree exclusions this block used to carry — src/Core, src/Reporting,
  # src/Infrastructure/Console, src/Architecture/Domain, the *Options.php globs —
  # became pure compensation for a rule-level false positive and were removed.
  # They were also hiding ~23 genuine boolean arguments, which are now visible.
  code-smell.boolean-argument:
    allowed_prefixes: [is, has, can, should, will, did, was]

  code-smell.error-suppression:
    allowed_functions:
      - file_get_contents
      - file_put_contents
      - fopen
      - unlink
      - mkdir
      - rename
      - rmdir
      - json_decode
      - token_get_all
      - proc_open
      - hash_file
      - igbinary_serialize
      - igbinary_unserialize
      - unserialize

  # Data-carrying objects and pipeline services need many constructor params.
  # This is a natural pattern for immutable VOs, not a design smell.
  code-smell.long-parameter-list:
    warning: 8
    error: 12
    suppress_paths:
      - exact: src/Reporting/Report.php
      - exact: src/Reporting/FormatterContext.php
      - exact: src/Analysis/Evidence/DependencyModel/DependencyGraph.php
      - exact: src/Analysis/Run/Contract/Collection/SuccessfulFileProcessing.php
      - exact: src/Analysis/Run/Pipeline/AnalysisPipeline.php
      - exact: src/Infrastructure/Console/Command/CheckCommand.php
      - exact: src/Infrastructure/Console/ResultPresenter.php
      - exact: src/Analysis/Finding/Contract/Finding.php

  code-smell.constructor-overinjection:
    suppress_paths:
      - exact: src/Reporting/Report.php
      - exact: src/Reporting/FormatterContext.php
      - exact: src/Analysis/Run/Contract/Collection/SuccessfulFileProcessing.php

  code-smell.unreachable-code:
    warning: 1
    error: 1

  # MethodCountMetrics tracks many per-class counts (each is a separate property)
  size.property-count:
    warning: 15
    error: 15
    suppress_paths:
      - exact: src/Analysis/Evidence/Size/MethodCountMetrics.php

  # --- Design ---

  # AbstractRule and AbstractCollector have many children — this is by design
  # (one rule/collector per metric category).
  design.noc:
    warning: 10
    error: 10
    suppress_paths:
      - exact: src/Analysis/Finding/Contract/Rule/AbstractRule.php
      - exact: src/Analysis/Evidence/Measurement/Contract/AbstractCollector.php

  cohesion.lcom:
    warning: 5
    error: 5

  design.dit:
    warning: 4
    error: 4

  design.god-class:
    suppress_paths:
      - subtree: src/Reporting/Formatter/Health

  # --- Maintainability ---
  maintainability.mi:
    warning: 35
    error: 35

  size.method-count:
    warning: 20
    error: 20

  # Health debt is ratcheted in qmx-baseline.json; new regressions fail selfcheck.
  health.cohesion:
    suppress_paths:
      # A console command shares no fields by construction: `configure()` touches
      # none of them and the helpers are static, so shared-field cohesion
      # mis-models the design rather than reporting debt. These six classes sit
      # at exactly 40 and are the whole of that debt on this root today.
      # (`DirectivesCommand` stood here through X14; X15 removed its own
      # `reportError()` helper, which raised its cohesion to 75.36 — above
      # this rule's warning boundary — so the entry suppressed nothing and
      # was dropped rather than carried forward inert.)
      #
      # Named one by one rather than by the namespace they share, and the
      # difference is measured, not stylistic. The namespace form took the
      # channel off all nineteen classes of the root and off every command
      # written after it; `CheckCommand` sits at exactly 50.0 against a warning
      # boundary of 50.0, so it publishes nothing today and would publish on the
      # first method that lowers it. Oracle: with the boundary moved to 51, the
      # namespace form suppresses CheckCommand's finding and this form publishes
      # it. At the real boundary the published set of `bin/qmx check src/` is
      # identical under both — 221 findings, byte for byte — so this buys the
      # early signal back at no cost to the ratchet.
      #
      # What it costs instead: a listed file whose cohesion later rises leaves a
      # path exclusion that silences nothing and says so to nobody. An exclusion
      # has no staleness verdict, unlike an inline directive; that is the price
      # of keeping the decision in configuration rather than in six docblocks.
      - exact: src/Infrastructure/Console/Command/BaselineCleanupCommand.php
      - exact: src/Infrastructure/Console/Command/BaselineExplainCommand.php
      - exact: src/Infrastructure/Console/Command/BaselineGenerateCommand.php
      - exact: src/Infrastructure/Console/Command/BaselineUpdateCommand.php
      - exact: src/Infrastructure/Console/Command/Debug/LayerAssignmentCommand.php
      # X15 adds two more of the same shape. `GraphExportCommand` measured
      # 40.0 before the round touched it and measures the same after, so it
      # is the existing debt of this root becoming visible, not new debt.
      # `BaselineRenameChannelsCommand` is the one the round moved, and the
      # mechanism was measured rather than assumed: splitting its
      # `doExecute()` took it from 4 methods to 9, and `health.cohesion`
      # gives a fixed boost only below 6, so the score fell while LCOM stayed
      # at 3. The metric reports the cliff, not the design.
      #
      # `Application` is the round's own new debt, named as such: adding
      # `configureIO()` (the `--silent` demotion above) took it from 30.0 to
      # 20.0, which crosses this rule's own error/warning boundary (25.0) —
      # `docs/internal/generated/suppression/composition.tsv` records the
      # entry's severity as `error` where it was `warning` before this round.
      # Accepted rather than split further: `doRun()`, `renderThrowable()`,
      # `applyWorkingDirOption()` and `configureIO()` are four independent
      # ladder/IO concerns that share no fields by construction, the same
      # argument the class comment above makes for the seven listed commands.
      - exact: src/Infrastructure/Console/Application.php
      - exact: src/Infrastructure/Console/Command/GraphExportCommand.php
      - exact: src/Infrastructure/Console/Command/BaselineRenameChannelsCommand.php
      # The carrier's own three types, for the same reason the namespace entry
      # below gives for their root: the file channel is addressed separately
      # from the namespace one, so the root entry alone leaves these standing.
      - exact: src/Analysis/Configuration/Contract/Refusal/ConfigurationOrigin.php
      - exact: src/Analysis/Configuration/Contract/Refusal/ConfigurationRefusal.php
      - exact: src/Analysis/Configuration/Contract/Refusal/RefusedPosition.php
    suppress_namespace_channels:
      health.cohesion:
        # Stateless expansion algorithms and their immutable result do not share
        # fields; cohesion is structurally inapplicable only to this exact root.
        - exact: 'Qualimetrix\Analysis\Policy\Architecture\Layer\Expansion'
        # The exact root recursively unions independent Debt and Impact
        # subjects; shared-field cohesion 48.6 is not a root invariant.
        - exact: 'Qualimetrix\Analysis\Evidence\Prioritization'
        # An exception carrying an origin and a position, and three immutable
        # values it is built from, share no fields with each other: cohesion is
        # structurally inapplicable to this exact root, the same argument the
        # Expansion entry above makes.
        - exact: 'Qualimetrix\Analysis\Configuration\Contract\Refusal'
        # X16's exclude-binding root: three classes (46.7). Measured, not
        # argued: `cohesion.tcc.count` is 1 there, so the namespace TCC and LCC
        # averages the score is built from are decided by a single class — the
        # `*Options` one. The rule and the probe beside it each hold one field
        # or none, which leaves them no pair of methods that could share a
        # field, so they contribute no TCC at all. And that one options class
        # measures TCC 0 by construction of the mandatory
        # `RuleOptionsInterface` shape: `isEnabled()` reads the single
        # `enabled` field and `getSeverity()` reads none, so the class has
        # exactly one method pair and it shares nothing.
        #
        # The same shape inside a larger root is dissolved by its neighbours
        # and never reaches the boundary: X16 added an options class of exactly
        # this shape to `Evidence\Coupling` (TCC 0, class score 65.3) and that
        # namespace does not report. So the finding is a property of how small
        # the root is, not of its design, and splitting further only makes the
        # roots smaller. The channel is excluded, not the rule: class-level
        # cohesion inside the root stays measured, and every other channel of
        # the namespace stays measured with it. Exact root — `[Q]` keeps a
        # future child namespace judged on its own.
        #
        # `Finding\SuppressionBinding` sat here for the same reason and was
        # removed in X16's F1: the scope-judgement class the round added is a
        # second TCC contributor, the average is no longer one class's, and the
        # namespace stopped reporting. The entry was measured inert, and an
        # inert suppression is exactly what this round is about.
        - exact: 'Qualimetrix\Analysis\Run\ExcludeBinding'
