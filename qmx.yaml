# Qualimetrix — project configuration (dogfooding)
#
# We analyze ourselves with our own tool. This config tunes thresholds
# and documents structural exceptions; qmx-baseline.json ratchets residual debt.
#
# Refactor real quality debt first. Use exact, active exclusions only for
# intentional contract popularity or structural inapplicability. Keep other
# accepted quality signals under a finite @qmx-threshold or ratchet ceiling.

# qmx.architecture.yaml is generated from the internal manifest and checked
# whole by `composer architecture:check`. A key written here overrides it
# outside that check, and a list replaces a list whole: writing
# `architecture.layers` or one `architecture.allow.<layer>` here drops the
# generated list instead of extending it.
imports: [qmx.architecture.yaml]

# Direct invocations default to error; composer selfcheck judges warnings too.
failOn: error

# Self-analysis with duplication detection needs more memory
memory_limit: 1G

# Coupling: mark vendor dependencies as framework
coupling:
  framework-namespaces:
    - subtree: Symfony
    - subtree: PhpParser
    - subtree: Psr
    - subtree: Amp

rules:
  # --- Architecture ---

  # The four sibling layer diagnostics (coverage, unreachable-layer,
  # potential-shadow, empty-template) no longer take a severity here: they
  # report a configuration error, so they fail the build unconditionally and
  # cannot be accepted by the ratchet. Only the edge violations this rule
  # reports as code debt still have a severity to choose.
  architecture.layer-violation:
    severity: error

  # --- Coupling ---

  # Core value objects are coupling magnets by design — every domain depends on them.
  coupling.cbo:
    suppress_namespace_channels:
      coupling.cbo:namespace:
        # Only public namespace readership is excepted; class CBO keeps its finite bound.
        - exact: 'Qualimetrix\Analysis\Evidence\ComputedMetrics\Contract\Definition'
        # Exact inbound contract vocabulary; descendant namespaces remain judged.
        - exact: 'Qualimetrix\Analysis\Configuration\Contract\Refusal'
        # Resolved-document values and interfaces are public vocabulary read by
        # declared configuration owners; executable policy remains judged.
        - exact: 'Qualimetrix\Analysis\Configuration\Contract\Document'
        - exact: 'Qualimetrix\Analysis\Finding\Contract\ProjectScope'
        # These exact contract namespaces grow with their intended named readers.
        - exact: 'Qualimetrix\Analysis\Evidence\DependencyModel\Contract'
        - exact: 'Qualimetrix\Analysis\Policy\Architecture\Contract'
        # Authored directive values are shared contracts read by their named consumers.
        - exact: 'Qualimetrix\Analysis\Policy\Inline\Contract\Directive'
        # Shared run policies and scope records are read across capability owners.
        - exact: 'Qualimetrix\Analysis\Run\Contract\Configuration'
        # Published channel vocabulary and baseline records are read by their named owners.
        - exact: 'Qualimetrix\Analysis\Finding\Contract\Channel'
        - exact: 'Qualimetrix\Analysis\Policy\Baseline\Contract'
        - exact: 'Qualimetrix\Analysis\Configuration\Contract\Document\Schema'
        - exact: 'Qualimetrix\Analysis\Evidence\Measurement\Contract'
        - exact: 'Qualimetrix\Analysis\Finding\Contract'
        - exact: 'Qualimetrix\Analysis\Finding\Contract\Population'
        - exact: 'Qualimetrix\Analysis\Finding\Contract\Rule'
        - exact: 'Qualimetrix\Analysis\Finding\Contract\Rule\OptionLanguage'
        - exact: 'Qualimetrix\Analysis\Finding\Contract\Rule\Override'
        - exact: 'Qualimetrix\Core\Ast'
        # Judged file-target primitives every owner that reads or writes a file by identity uses.
        - exact: 'Qualimetrix\Core\FileTarget'
        - exact: 'Qualimetrix\Core\Path'
        - exact: 'Qualimetrix\Core\Pattern'
        - exact: 'Qualimetrix\Core\Symbol'
        - exact: 'Qualimetrix\Reporting\Contract\Report'
        - exact: 'Qualimetrix\Analysis\Policy\Baseline\Contract\Entry'
        - exact: 'Qualimetrix\Analysis\Run\Contract\Discovery'
        - exact: 'Qualimetrix\Reporting\FindingProjection\Contract'
    suppress_paths:
      - exact: src/Analysis/Evidence/Measurement/Contract/ResettableVisitorInterface.php
      - exact: src/Analysis/Evidence/Measurement/Contract/AggregationStrategy.php
      - exact: src/Analysis/Evidence/Measurement/Contract/DeclarationIndexAwareInterface.php
      - exact: src/Analysis/Evidence/Measurement/Contract/MetricDefinition.php
      - exact: src/Analysis/Evidence/Measurement/Contract/AbstractCollector.php
      - exact: src/Core/ProductIdentity.php
      - exact: src/Reporting/Contract/Formatting/FormatterContext.php
      - exact: src/Reporting/Contract/Report/Report.php
      # Exact inbound contract and neutral-value hubs; sibling implementations remain judged.
      # Profiling's port has incoming readers and no outgoing project dependencies.
      - exact: src/Core/Profiler/Contract/ProfilerInterface.php
      - exact: src/Analysis/Configuration/Contract/Refusal/ConfigurationOrigin.php
      - exact: src/Analysis/Configuration/Contract/Refusal/ConfigurationRefusal.php
      - exact: src/Analysis/Configuration/Contract/Refusal/RefusedPosition.php
      - exact: src/Analysis/Finding/Contract/Channel/ChannelDeclaration.php
      - exact: src/Analysis/Finding/Contract/Channel/ChannelDeclarationRegistryInterface.php
      - exact: src/Analysis/Finding/Contract/Channel/ChannelShape.php
      - exact: src/Analysis/Finding/Contract/Finding.php
      - exact: src/Analysis/Finding/Contract/Channel/FindingChannel.php
      - exact: src/Analysis/Finding/Contract/Location.php
      - exact: src/Analysis/Finding/Contract/Population/GateInput.php
      - exact: src/Analysis/Finding/Contract/Population/JudgedPopulation.php
      - exact: src/Analysis/Finding/Contract/Population/PopulationIdentity.php
      - exact: src/Analysis/Finding/Contract/Rule/AnalysisContext.php
      - exact: src/Analysis/Finding/Contract/Rule/Attribute/CliAlias.php
      - exact: src/Analysis/Finding/Contract/Rule/OptionLanguage/BandDirection.php
      - exact: src/Analysis/Finding/Contract/Rule/OptionLanguage/ResolvedRuleOptionValues.php
      - exact: src/Analysis/Finding/Contract/Rule/OptionLanguage/RuleOptionKeySet.php
      - exact: src/Analysis/Finding/Contract/Rule/OptionLanguage/RuleOptionShape.php
      - exact: src/Analysis/Finding/Contract/Rule/OptionLanguage/RuleOptionSurface.php
      - exact: src/Analysis/Finding/Contract/Rule/RuleOptionsInterface.php
      - exact: src/Analysis/Finding/Contract/Rule/ThresholdAwareOptionsInterface.php
      - exact: src/Analysis/Finding/Contract/RuleConfigurationInterface.php
      - exact: src/Analysis/Finding/Contract/Severity.php
      - exact: src/Core/Path/AbsolutePath.php
      - exact: src/Core/Path/RelativePath.php
      - exact: src/Core/Symbol/ClassNameSpelling.php
      - exact: src/Core/Symbol/MetricSubject.php
      - exact: src/Core/Symbol/SymbolInfo.php
      - exact: src/Core/Symbol/SymbolLevel.php
      - exact: src/Core/Symbol/SymbolPath.php
      - exact: src/Core/Symbol/SymbolType.php
      # The dependency-kind vocabulary is a shared inbound contract.
      - exact: src/Analysis/Evidence/DependencyModel/Contract/DependencyType.php
      # The metric-value contract is read across capability owners.
      - exact: src/Analysis/Evidence/Measurement/Contract/MetricBag.php
      # Collection, global derivation and finding consumers share this repository
      # contract; its incoming readership is intentional.
      - exact: src/Analysis/Evidence/Measurement/Contract/MetricRepositoryInterface.php
      # The accepted baseline document is shared by capture and ceiling judgement.
      - exact: src/Analysis/Policy/Baseline/Contract/Entry/Baseline.php
      # MetricName is the common key vocabulary read by collectors, formulas and
      # judging channel declarations; splitting it would split the same metric language.
      - exact: src/Analysis/Evidence/Measurement/Contract/MetricName.php
      # The graph contract is intentionally a widely consumed type hub. Keep this
      # exact declaration measured by other rules without excluding its siblings.
      - exact: src/Analysis/Evidence/DependencyModel/Contract/DependencyGraphInterface.php
      # Resolved values are the shared read port of declared section owners;
      # Their inbound reach follows those readers, not a missing decomposition.
      - exact: src/Analysis/Configuration/Contract/Document/ResolvedValueInterface.php
      # The section declaration language is built by each owner; its reach
      # reflects those consumers and its declaration vocabulary.
      - exact: src/Analysis/Configuration/Contract/Document/Schema/NodeSchema.php
      # Document owners and refusal adapters read authored source provenance from
      # this carrier; those consumers are its contract responsibility.
      - exact: src/Analysis/Configuration/Contract/Document/Provenance.php
      # RunConfiguration carries discovery, collection and rule policies to named
      # Run and delivery consumers; its reach follows that shared run boundary.
      - exact: src/Analysis/Run/Contract/Configuration/RunConfiguration.php
      # Authored formula, applicability and threshold consumers read the same
      # immutable computed-metric definition contract.
      # File-target readers share one typed failure cause so refusal and cleanup
      # retain the same filesystem outcome.
      - exact: src/Core/FileTarget/FileTargetFailure.php
      # ResolvedTarget retains judged path membership and identity facts.
      - exact: src/Core/FileTarget/Resolution/ResolvedTarget.php
      # FileIdentity is the one identity every input reader records and every
      # writer compares against; each such reader and writer must name it.
      - exact: src/Core/FileTarget/FileIdentity.php
      # NativeCall is the one way a native filesystem call is made without a
      # stray warning; every reader that stats or opens a file must name it.
      - exact: src/Core/FileTarget/NativeCall.php
      # NamespacePattern binds the shared selector definition to namespace separators
      # for authored configuration, finding exclusion and reporting drill-down.
      - exact: src/Core/Pattern/NamespacePattern.php
      # The closed vocabulary of configuration source kinds: every owner that
      # creates an origin or classifies one by kind must name it.
      - exact: src/Analysis/Configuration/Contract/Refusal/ConfigurationSource.php
      # The one wrapper that turns a native filesystem call's warning into a typed
      # result; every owner making such a call is meant to go through it.
      - exact: src/Core/FileTarget/NativeCall.php
      # AST visitors depend on many php-parser node types (not actionable coupling).
      # Exact capability roots preserve the visitor exclusion without enrolling
      # a future Analysis/Evidence sibling.
      # Depth inside a capability root is deliberately not an axis. PathMatcher globs
      # through fnmatch without FNM_PATHNAME, so `*` crosses `/` and these patterns
      # kept matching after Design was split into subject folders. That is the chosen
      # behaviour, not an accident to be pinned back: the enrolment this list guards
      # against is a future sibling capability, while a subject folder inside an
      # already-excluded capability is that capability's own business. Pinning the
      # globs per subject would also mean editing every rule block below for each
      # new subject, which is the cost this shape buys off.
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Complexity/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Size/.*Visitor\.php'
      # ConfigurationDocument is the shared resolved authored document read by each
      # capability resolver. This exact path remains separate from the Refusal subtree
      # and does not enroll unrelated Configuration contracts.
      - exact: src/Analysis/Configuration/Contract/ConfigurationDocument.php
    namespace:
      warning: 16
      error: 25
    class:
      warning: 20
      error: 30

  # Core contracts and value objects are coupling hubs by design.
  coupling.class-rank:
    suppress_paths:
      - exact: src/Core/Symbol/DeclarationPath.php
      - exact: src/Analysis/Finding/Contract/Rule/OptionLanguage/RuleOptionShape.php
      # Exact shared contract and neutral-value hubs retain intentional inbound ranking.
      - exact: src/Analysis/Finding/Contract/Finding.php
      - exact: src/Analysis/Finding/Contract/Channel/FindingChannel.php
      - exact: src/Analysis/Finding/Contract/Population/GateInput.php
      - exact: src/Analysis/Finding/Contract/Rule/OptionLanguage/ResolvedRuleOptionValues.php
      - exact: src/Analysis/Finding/Contract/Rule/OptionLanguage/RuleOptionKeySet.php
      - exact: src/Core/Path/AbsolutePath.php
      - exact: src/Core/Path/RelativePath.php
      - exact: src/Core/Symbol/MetricSubject.php
      - exact: src/Core/Symbol/SymbolPath.php
      # The identity every input reader records and every writer compares against.
      - exact: src/Core/FileTarget/FileIdentity.php
      # Shared document provenance is a contract hub consumed across capabilities.
      - exact: src/Analysis/Configuration/Contract/Document/Provenance.php
      # Shared document schema is a contract hub consumed across capabilities.
      - exact: src/Analysis/Configuration/Contract/Document/Schema/NodeSchema.php
      # Shared source origin is a contract hub consumed across capabilities.
      - exact: src/Analysis/Configuration/Contract/Refusal/ConfigurationOrigin.php
      # The provider-owned metric bag is a shared carrier for collectors and rules.
      - exact: src/Analysis/Evidence/Measurement/Contract/MetricBag.php
      # This neutral authored-selector value is shared by path and namespace consumers.
      - exact: src/Core/Pattern/SelectorDefinition.php
      # The neutral source-byte primitive preserves identities across source and publication consumers.
      - exact: src/Core/SourceText/SourceBytes.php
      # The shared refusal carrier intentionally centralizes source-attributed refusals.
      - exact: src/Analysis/Configuration/Contract/Refusal/ConfigurationRefusal.php
      # Refusal position metadata carries the same source facts to configuration consumers.
      - exact: src/Analysis/Configuration/Contract/Refusal/RefusedPosition.php
  # Exact public contract and neutral primitive vocabularies are concrete by design.
  # Implementation namespaces retain their quality findings and named warning owners.
  coupling.distance:
    suppress_namespaces:
      # Published findings, coverage and health values form one concrete public report snapshot.
      - exact: 'Qualimetrix\Reporting\Contract\Report'
      # Rule definitions, typed option contracts and their queries form the public authoring language.
      - exact: 'Qualimetrix\Analysis\Finding\Contract\Rule'
      # Authored selection values form the public decision and trace vocabulary read by execution and adapters.
      - exact: 'Qualimetrix\Analysis\Finding\Contract\Selection'
      # Terminal analysis coverage and failure values form the public run-completion vocabulary read by Console and Baseline.
      - exact: 'Qualimetrix\Analysis\Run\Contract\Coverage'
      # Trait declaration facts, method sources, result and failure values are neutral public vocabulary; resolution operations remain outside Contract.
      - exact: 'Qualimetrix\Core\Symbol\TraitComposition\Contract'
      # Acceptance entries, identities and modes are concrete public values read across baseline and Console.
      - exact: 'Qualimetrix\Analysis\Policy\Baseline\Contract\Entry'
      # The public typed option vocabulary carries keys, shapes and threshold bands to its named readers.
      - exact: 'Qualimetrix\Analysis\Finding\Contract\Rule\OptionLanguage'
      # Public population predicates and measured judgements are concrete values without an abstract provider lifecycle.
      - exact: 'Qualimetrix\Analysis\Finding\Contract\Population'
      # Baseline coverage and comparison outcomes carry acceptance facts to named consumers.
      - exact: 'Qualimetrix\Analysis\Policy\Baseline\Contract'
      # Authored directive records carry source spelling, exact subjects and positions to extraction and audit.
      - exact: 'Qualimetrix\Analysis\Policy\Inline\Contract\Directive'
      # Source-universe and narrowed-scope conclusions are concrete public judgement facts.
      - exact: 'Qualimetrix\Analysis\Finding\Contract\ProjectScope'
      # Neutral public target-lifecycle primitives retain concrete path and publication semantics.
      - exact: 'Qualimetrix\Core\FileTarget'
      # Neutral typed path values and spelling conversions need no abstract provider.
      - exact: 'Qualimetrix\Core\Path'
      # Neutral selector values and matching vocabulary retain concrete pattern semantics.
      - exact: 'Qualimetrix\Core\Pattern'
      # Neutral symbol identities and spelling values are concrete shared primitives.
      - exact: 'Qualimetrix\Core\Symbol'
      # Channel declarations and publication values form a shared public language.
      - exact: 'Qualimetrix\Analysis\Finding\Contract\Channel'
      # Immutable score and coverage values carry public health facts.
      - exact: 'Qualimetrix\Analysis\Evidence\ComputedMetrics\Health\Contract\Score'
      # Rank modes, offender records and selections are concrete public reporting vocabulary.
      - exact: 'Qualimetrix\Analysis\Evidence\ComputedMetrics\Health\Contract\Offender'
      # Finding transports and execution outcomes are concrete public facts consumed by evidence, policy and reporting.
      - exact: 'Qualimetrix\Analysis\Finding\Contract'
      # Override axes, requests, validation results and the validator promise are public rule-language vocabulary.
      - exact: 'Qualimetrix\Analysis\Finding\Contract\Rule\Override'
      # Authored origins, positions and refusal causes are concrete public diagnostic values.
      - exact: 'Qualimetrix\Analysis\Configuration\Contract\Refusal'
      # The public section declaration language combines a registration port, builders and immutable schema vocabulary.
      - exact: 'Qualimetrix\Analysis\Configuration\Contract\Document\Schema'
      # Composer source facts and reader ports form the public invocation-snapshot boundary.
      - exact: 'Qualimetrix\Analysis\ProjectManifest\Contract'
      # Run policies and measured source scope are concrete shared invocation facts.
      - exact: 'Qualimetrix\Analysis\Run\Contract\Configuration'
    max_distance_warning: 0.5
    max_distance_error: 0.7

  coupling.instability:
    class:
      min_afferent: 2
    namespace:
      min_afferent: 2
      max_warning: 0.9
      max_error: 1.0

  # --- Complexity ---

  # AST visitors inherently have high NPath/CCN/WMC due to many node type branches.
  # This is structural complexity from matching PHP AST node types, not a design flaw.
  #
  # Each regex below names an existing evidence capability and its AST visitors;
  # non-visitor orchestration and rule judgement stay measured.
  complexity.npath:
    suppress_paths:
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      # No Complexity root: no visitor there branches on node types past the
      # bound, and an entry that suppresses nothing would hide the first one that does.
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Size/.*Visitor\.php'

  # Shared executable option parsing leaves only reviewed declaration metadata.
  duplication.clone:
    min_tokens: 100
    suppress_paths:
      # Only interface/trait declarations, empty constructors and option-key metadata remain.
      # Executable parsing and severity operations are shared in Finding-owned traits.
      - exact: src/Analysis/Evidence/CodeSmell/ParameterCount/ConstructorOverinjectionOptions.php
      - exact: src/Analysis/Evidence/CodeSmell/UnreachableCode/UnreachableCodeOptions.php
      - exact: src/Analysis/Evidence/Complexity/Cognitive/ClassCognitiveComplexityOptions.php
      - exact: src/Analysis/Evidence/Complexity/Cognitive/MethodCognitiveComplexityOptions.php
      - exact: src/Analysis/Evidence/Complexity/Cyclomatic/ClassComplexityOptions.php
      - exact: src/Analysis/Evidence/Complexity/Cyclomatic/MethodComplexityOptions.php
      - exact: src/Analysis/Evidence/Complexity/Npath/MethodNpathComplexityOptions.php
      - exact: src/Analysis/Evidence/Coupling/Cbo/ClassCboOptions.php
      - exact: src/Analysis/Evidence/Coupling/Cbo/NamespaceCboOptions.php
      - exact: src/Analysis/Evidence/Coupling/Instability/ClassInstabilityOptions.php
      - exact: src/Analysis/Evidence/Coupling/Instability/NamespaceInstabilityOptions.php
      - exact: src/Analysis/Evidence/Design/Inheritance/InheritanceOptions.php
      - exact: src/Analysis/Evidence/Design/Inheritance/NocOptions.php
      - exact: src/Analysis/Evidence/Size/ClassCount/ClassCountOptions.php
      - exact: src/Analysis/Evidence/Size/MethodCount/MethodCountOptions.php

  complexity.ccn:
    suppress_paths:
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Complexity/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'
      # No Security root: no visitor there branches on node types past the bound,
      # and an entry that suppresses nothing would hide the first one that does.
      - regex: 'src/Analysis/Evidence/Size/.*Visitor\.php'

  complexity.wmc:
    suppress_paths:
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Complexity/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Size/.*Visitor\.php'

  complexity.cognitive:
    suppress_paths:
      - regex: 'src/Analysis/Evidence/CodeSmell/.*Visitor\.php'
      - regex: 'src/Analysis/Evidence/Cohesion/.*Visitor\.php'
      # No Complexity root, for the reason given under complexity.npath.
      - regex: 'src/Analysis/Evidence/Maintainability/.*Visitor\.php'

  # --- Code Smells ---

  # No exclusions needed: the rule itself no longer flags promoted constructor
  # properties (a promoted param is a field declaration, not a behavior switch),
  # so the whole-tree exclusions this block used to carry — src/Core, src/Reporting,
  # src/Infrastructure/Console, src/Architecture/Domain, the *Options.php globs —
  # became pure compensation for a rule-level false positive and were removed.
  # They were also hiding ~23 genuine boolean arguments, which are now visible.
  code-smell.boolean-argument:
    allowed_prefixes: [is, has, can, should, will, did, was]

  code-smell.error-suppression:
    allowed_functions:
      - file_get_contents
      - file_put_contents
      - fopen
      - unlink
      - mkdir
      - rename
      - rmdir
      - json_decode
      - token_get_all
      - proc_open
      - hash_file
      - igbinary_serialize
      - igbinary_unserialize
      - unserialize

  # Applies to methods and functions only: constructors belong to
  # constructor-overinjection, value-object constructors to the vo-* thresholds.
  # Many methods here pass independent authored and measured facts as arguments;
  # the default 4/6 would report about 480 of them.
  code-smell.long-parameter-list:
    warning: 8
    error: 12

  code-smell.unreachable-code:
    warning: 1
    error: 1

  # MethodCountMetrics tracks many per-class counts (each is a separate property)
  size.property-count:
    warning: 15
    error: 15

  # --- Design ---

  # AbstractRule and AbstractCollector have many children — this is by design
  # (one rule/collector per metric category).
  design.noc:
    warning: 10
    error: 10
    suppress_paths:
      - exact: src/Analysis/Finding/Rule/AbstractRule.php
      - exact: src/Analysis/Evidence/Measurement/Contract/AbstractCollector.php

  cohesion.lcom:
    warning: 5
    error: 5

  design.dit:
    warning: 4
    error: 4

  # --- Maintainability ---
  maintainability.mi:
    warning: 35
    error: 35

  size.method-count:
    warning: 20
    error: 20

  # Health debt is ratcheted in qmx-baseline.json; new regressions fail selfcheck.
