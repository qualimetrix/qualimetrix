exclude_paths: []
computed_metrics:
  health.complexity: { warning: 100, error: 100 }
  health.cohesion: { warning: 100, error: 100 }
  health.coupling: { warning: 100, error: 100 }
  health.typing: { warning: 100, error: 100 }
  health.maintainability: { warning: 100, error: 100 }
  health.overall: { warning: 100, error: 100 }
  # Reads no metric on purpose. A formula addresses a metric key in a grammar
  # that the vocabulary rename replaces, so the two trees would spell this line
  # differently and the reference could not be handed either spelling: the form
  # of the expression is not a name, and a map row translates names. What the
  # case is here to fire is a USER-DEFINED computed metric channel, and that it
  # still does. Formulas that do read metric keys stay compared through the six
  # built-in health dimensions above, whose bodies live in product source.
  #
  # What that costs, named rather than left to be discovered: a constant is the
  # same at every level, so this channel no longer distinguishes one level's
  # value from another's. The six dimensions above do, at all three levels, so
  # the corpus keeps that property — but it is theirs now, not this metric's.
  computed.branch_load:
    formula: "clamp(37, 0, 100)"
    description: "A fixed score; the corpus' user-defined computed metric"
    levels: [class, namespace, project]
    warning: 0
    error: 100
    inverted: false
