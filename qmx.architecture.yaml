# Generated by `composer architecture:generate` from
# docs/internal/modular-architecture-manifest.json and the production AST.
# Do not edit: `composer architecture:check` refuses any difference.
# qmx.yaml imports this file.
#
# A coarse enforcement projection: one semantic-owner layer per owner and
# no singleton seams. Exact internal visibility, contract consumers and
# exact source-to-target grants are validated by `composer architecture:check`
# before self-analysis; a coarse allow never authorises an unlisted exact import.
#
# Declaration order matters (ADR 0006: first match wins). Patterns are exact
# FQCNs and the final external catch-all excludes Qualimetrix\**, so a new
# project declaration fails coverage until the manifest is reviewed. Counts
# live in docs/internal/generated/modular-architecture/, never here.
