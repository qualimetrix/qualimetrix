# Strict preset — for greenfield projects with high quality standards.
# Tightens thresholds ~30-50% compared to defaults.

failOn: warning

rules:
  complexity.cyclomatic:
    callable:
      warning: 7
      error: 15
    class:
      max_warning: 20
      max_error: 35
  complexity.cognitive:
    callable:
      warning: 10
      error: 20
    class:
      max_warning: 20
      max_error: 35
  complexity.npath:
    callable:
      warning: 100
      error: 500
  complexity.wmc:
    warning: 35
    error: 60
  size.method-count:
    warning: 15
    error: 20
  size.class-count:
    warning: 10
    error: 18
  size.property-count:
    warning: 10
    error: 15
  maintainability.index:
    warning: 50
    error: 30
  design.lcom:
    warning: 2
    error: 3
  design.noc:
    warning: 7
    error: 10
  design.inheritance:
    warning: 3
    error: 5
  coupling.cbo:
    class:
      warning: 10
      error: 16
    namespace:
      warning: 10
      error: 16
  coupling.instability:
    class:
      max_warning: 0.7
      max_error: 0.9
    namespace:
      max_warning: 0.7
      max_error: 0.9
  coupling.distance:
    max_distance_warning: 0.2
    max_distance_error: 0.4
  code-smell.constructor-overinjection:
    warning: 6
    error: 10
  code-smell.long-parameter-list:
    warning: 3
    error: 5
    vo-warning: 6
    vo-error: 10
  design.type-coverage:
    param_warning: 90
    param_error: 70
    return_warning: 90
    return_error: 70
    property_warning: 90
    property_error: 70
