name: Deploy Documentation

on:
  push:
    tags:
      - 'v*'
  # Manual redeploy: the site otherwise only rebuilds on a version tag, which
  # leaves no way to republish after a Pages outage or a docs-only fix.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: 'website/requirements.txt'

      - name: Install dependencies
        run: pip install -r website/requirements.txt

      # --strict matches the gate in `composer check`: a warning here (broken
      # internal link, page missing from the nav) must fail the deploy rather
      # than publish a site with dead links.
      - name: Build documentation
        run: mkdocs build --strict --config-file website/mkdocs.yml --site-dir ${{ github.workspace }}/_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
