name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"

          # Extract section between ## [version] and the next ## [
          notes=$(awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)

          # Trim leading/trailing blank lines
          notes=$(echo "$notes" | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba;}')

          if [ -z "$notes" ]; then
            echo "::warning::No changelog entry found for version $version"
            notes="No changelog entry found for this version."
          fi

          # Write to file for gh release
          echo "$notes" > /tmp/release-notes.md

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # The version the tool reports about itself is read from
      # vendor/composer/installed.php, which `composer install` writes and
      # `composer dump-autoload` does not refresh — measured, after the
      # opposite was assumed. Without COMPOSER_ROOT_VERSION here, composer
      # records whatever it can work out for the root package: `dev-main` in a
      # checkout of this repository and `1.0.0+no-version-set` in a copy of one.
      # Either is a release archive answering --version with a non-version.
      - name: Install production dependencies
        env:
          COMPOSER_ROOT_VERSION: ${{ steps.version.outputs.version }}
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: Build the phar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: composer phar

      # Compared whole rather than searched for: `grep -F 1.0.0` also matches
      # `1.0.0+no-version-set`, and that placeholder is exactly what this step
      # exists to catch.
      - name: The phar names the version being released
        run: |
          set -o pipefail
          php build/qmx.phar --version | tee /tmp/phar-version.txt
          test "$(cat /tmp/phar-version.txt)" = "Qualimetrix ${{ steps.version.outputs.version }}"

      - name: Detect pre-release
        id: prerelease
        run: |
          if [[ "${{ steps.version.outputs.version }}" =~ (alpha|beta|rc|dev) ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping create."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md \
              ${{ steps.prerelease.outputs.flag }}
          fi

      # Separate from the create above, because that step is deliberately
      # skippable: a re-run against an existing release must still attach the
      # archive rather than leave the release without one.
      - name: Attach the phar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" build/qmx.phar --clobber
