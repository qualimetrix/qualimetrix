name: Qualimetrix

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # Commit messages are not covered by the file-content guard that runs inside
  # `composer check`, and scrubbing one after the fact needs a history rewrite.
  # Needs full history, so it is a separate job rather than a step in the
  # PHP matrix.
  commit-messages:
    name: Commit messages (private terms)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          # Optional. Without it the job is a no-op; the term list must never be
          # committed. Values from secrets are masked in logs, and the script
          # additionally never echoes a matched term.
          QMX_PRIVATE_TERMS: ${{ secrets.QMX_PRIVATE_TERMS }}
        run: |
          base='${{ github.event.before }}'
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            range='${{ github.event.pull_request.base.sha }}..HEAD'
          elif [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            range='HEAD~20..HEAD'
          else
            range="$base..HEAD"
          fi
          bash scripts/check-private-leaks.sh --commits "$range"

  # Example: Using the local GitHub Action
  analyze-with-action:
    name: Analyze with Action
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Qualimetrix Action
        id: qmx
        uses: ./
        with:
          paths: 'src/'
          # No baseline needed - using proper qmx.yaml configuration instead
          format: 'text'
          php-version: ${{ matrix.php-version }}

      - name: Show results
        if: always()
        run: |
          echo "Exit code: ${{ steps.qmx.outputs.exit-code }}"
          echo "Violations: ${{ steps.qmx.outputs.violations }}"

      - name: Upload results (if failed)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: qmx-action-results-${{ matrix.php-version }}
          path: |
            qmx-report.txt
            qmx-results.json
          retention-days: 7
          if-no-files-found: ignore

  # Full validation: cs-check + PHPUnit + PHPStan + selfcheck.
  # `composer check` ends with `bin/qmx check src/`, so this job subsumes
  # the previous "Self-Analysis (Direct)" step.
  check:
    name: Full validation (composer check)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run full validation
        env:
          # Feeds the name half of scripts/check-private-leaks.sh, which runs
          # first inside `composer check`. Absent secret = path and shape checks
          # only; the term list must never be committed.
          QMX_PRIVATE_TERMS: ${{ secrets.QMX_PRIVATE_TERMS }}
        run: composer check

      - name: Upload qmx results (if failed)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: qmx-direct-results-${{ matrix.php-version }}
          path: |
            qmx-report.txt
            qmx-results.json
          retention-days: 7
          if-no-files-found: ignore
